<script>
var firebaseConfig = {
  apiKey: "AIzaSyAqsd3CV9dCcqO6W1gL2WYkmsQhrrWOX6M",
  authDomain: "eleve-premios.firebaseapp.com",
  projectId: "eleve-premios",
  storageBucket: "eleve-premios.firebasestorage.app",
  messagingSenderId: "859486758492",
  appId: "1:859486758492:web:ad704bc5edfb87ac9a6899"
};

firebase.initializeApp(firebaseConfig);
var _db = firebase.firestore();

// Cada tabela em um documento separado para evitar limite de tamanho
var COLECOES = ["emp","oc","pr","idx","cc","oc5","motivos","sensos"];

window._fbLoad = function(){
  var promises = COLECOES.map(function(col){
    return _db.collection("eleve").doc(col).get();
  });
  return Promise.all(promises).then(function(snaps){
    snaps.forEach(function(snap, i){
      var col = COLECOES[i];
      if(snap.exists){
        var d = snap.data();
        window.DB[col] = d.dados || [];
      } else {
        window.DB[col] = [];
      }
    });
    // Inicializa sensos padrao se vazio
    if(!window.DB.sensos || window.DB.sensos.length === 0){
      window.DB.sensos = window.initSensos();
    }
    console.log("Firebase carregado OK:", {
      emp: window.DB.emp.length,
      oc: window.DB.oc.length,
      cc: window.DB.cc.length
    });
  });
};

window._fbSave = function(){
  var promises = COLECOES.map(function(col){
    return _db.collection("eleve").doc(col).set({
      dados: window.DB[col] || [],
      updated: new Date().toISOString()
    });
  });
  return Promise.all(promises).then(function(){
    console.log("Firebase salvo OK em", new Date().toLocaleTimeString());
  }).catch(function(e){
    console.error("Erro ao salvar no Firebase:", e);
    throw e;
  });
};

// Ping periodico para manter a base ativa (evita pausa por inatividade)
window._pingInterval=null;
window._startPing=function(){
  if(window._pingInterval)return;
  function ping(){
    _db.collection("eleve").doc("_ping").set({ultimo:new Date().toISOString()}).then(function(){
      console.log("Ping Firebase OK -",new Date().toLocaleTimeString("pt-BR"));
    }).catch(function(e){
      console.warn("Ping Firebase falhou:",e.message);
    });
  }
  ping();
  window._pingInterval=setInterval(ping,4*60*1000); // a cada 4 minutos
};

window._fbReady = true;
document.dispatchEvent(new Event("fb-ready"));
</script>

<script>
// ═══════════════════════════════════════
// DB GLOBAL
// ═══════════════════════════════════════
var DB={emp:[],oc:[],pr:[],idx:[],cc:[],oc5:[],motivos:[],sensos:[]};
var SAVE_TIMER=null;

function dbLoad(){
  return window._fbLoad();
}

function dbSave(){
  clearTimeout(SAVE_TIMER);
  showSync("Salvando...",false);
  SAVE_TIMER=setTimeout(function(){
    if(!window._fbSave){
      showSync("Firebase nao carregado!",false,true);
      return;
    }
    window._fbSave().then(function(){
      var t=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      showSync("Salvo "+t,true);
      setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    }).catch(function(e){
      showSync("Erro: "+e.message,false,true);
      console.error("dbSave error:",e);
    });
  },600);
}

function showSync(msg,ok,err){
  var bar=document.getElementById("sync-bar");
  var spin=document.getElementById("sync-spin");
  var txt=document.getElementById("sync-msg");
  bar.style.display="flex";
  bar.className="sync-bar"+(ok?" ok":err?" err":"");
  spin.style.display=(ok||err)?"none":"inline-block";
  txt.textContent=msg;
}

// ═══════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════
function toggleSenha(){
  var inp=document.getElementById("lp");
  var icon=document.getElementById("eye-icon");
  if(inp.type==="password"){
    inp.type="text";
    icon.className="ti ti-eye-off";
  }else{
    inp.type="password";
    icon.className="ti ti-eye";
  }
}
function doLogin(){
  var u=document.getElementById("lu").value;
  var p=document.getElementById("lp").value;
  u=u.trim();p=p.trim();
  if((u==="admin"&&p==="eleve2024")||(u==="eleve"&&p==="eleve2024")){
    document.getElementById("lerr").style.display="none";
    showSync("Carregando dados...",false);
    // Sempre recarrega do Firebase ao fazer login
    window._fbLoad().then(function(){
      console.log("Dados carregados do Firebase:", {
        emp: DB.emp.length,
        oc: DB.oc.length,
        cc: DB.cc.length,
        pr: DB.pr.length
      });
      document.getElementById("lgw").style.display="none";
      document.getElementById("app").style.display="flex";
      showSync("Dados carregados! ("+DB.emp.length+" colaboradores)",true);
      setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
      go("dashboard");
    }).catch(function(e){
      showSync("Erro ao carregar: "+e.message,false,true);
      console.error("Erro dbLoad:",e);
    });
  }else{
    document.getElementById("lerr").style.display="block";
  }
}
function doLogout(){
  document.getElementById("app").style.display="none";
  document.getElementById("lgw").style.display="flex";
  document.getElementById("lu").value="";
  document.getElementById("lp").value="";
}

// ═══════════════════════════════════════
// STARTUP — aguarda Firebase ficar pronto
// ═══════════════════════════════════════
function startApp(){
  // Inicia o ping para manter a base sempre ativa
  if(window._startPing)window._startPing();
  // Pre-load data before showing login
  document.getElementById("load-msg").textContent="Carregando dados...";
  window._fbLoad().then(function(){
    console.log("Pre-load OK:", DB.emp.length, "colaboradores");
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("lgw").style.display="flex";
  }).catch(function(e){
    console.warn("Pre-load falhou (normal se primeiro acesso):", e.message);
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("lgw").style.display="flex";
  });
}
if(window._fbReady){
  startApp();
}else{
  document.addEventListener("fb-ready",startApp);
  setTimeout(function(){
    if(!window._fbReady){
      document.getElementById("load-msg").textContent="Erro de conexao. Verifique a internet.";
    }
  },10000);
}

</script>
<script>

var B="#1a3a6b",BL="#2e5ca8",RED="#c0392b",GRN="#1a7a4a",GLD="#e6a817",PUR="#7b3fa0";
var MOS=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var TIPOS=[
  {k:"falta", lb:"Falta",  ic:"ti-calendar-x", co:RED, df:15},
  {k:"atraso",lb:"Atraso", ic:"ti-clock-x",    co:GLD, df:5}
];

// DB definido pelo Firebase acima
// dbLoad via Firebase
// dbSave via Firebase

function gmk(dt){var d=new Date(dt+"T12:00:00");return d.getFullYear()+"-"+(""+(d.getMonth()+1)).padStart(2,"0");}
function hoje(){return new Date().toISOString().slice(0,10);}
function curMes(){return gmk(hoje());}
function uid(){return Date.now()+""+Math.random().toString(36).slice(2,6);}
function esc(s){return(""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtBRL(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBRLInt(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$"+Math.round(v).toLocaleString("pt-BR");
}
function fmtM(m){var p=m.split("-");return MOS[parseInt(p[1])-1]+"/"+p[0];}
function ini(n){return n.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}
function tEmp(a,d){
  var i=new Date(a+"T12:00:00"),f=d?new Date(d+"T12:00:00"):new Date();
  var anos=(f-i)/(1000*60*60*24*365.25);
  if(anos<1){var m=Math.floor(anos*12);return m<=0?"< 1 mes":m+" mes"+(m>1?"es":"");}
  return anos.toFixed(1)+" anos";
}
function getPct(tipo,data){
  var at=DB.idx.filter(function(x){return x.tipo===tipo&&x.ini<=data&&(!x.fim||x.fim>=data);});
  if(at.length>0)return at[at.length-1].pct;
  return {falta:15,atraso:5,"5s":10}[tipo]||0;
}
function calcDesc(eid,mes,val){
  var ocs=DB.oc.filter(function(x){return x.eid===eid&&gmk(x.data)===mes;});
  var f=ocs.filter(function(x){return x.tipo==="falta";}).length;
  var a=ocs.filter(function(x){return x.tipo==="atraso";}).length;
  var s=ocs.filter(function(x){return x.tipo==="5s";}).length;
  var pct=0;ocs.forEach(function(x){pct+=getPct(x.tipo,x.data);});
  pct=Math.min(100,pct);
  return{f:f,a:a,s:s,pct:pct,desc:(pct/100)*val,rec:val*(1-pct/100)};
}
function getMeses(){
  var s={};s[curMes()]=1;DB.oc.forEach(function(o){s[gmk(o.data)]=1;});
  return Object.keys(s).sort().reverse();
}
function mSel(id,val){
  var ms=getMeses(),h="<select id="+JSON.stringify(id)+" style='padding:.4rem .75rem;border:1.5px solid #dde3f0;border-radius:8px;font-size:13px;color:"+B+";font-weight:600;background:#fff;width:auto'>";
  ms.forEach(function(m){h+="<option value="+JSON.stringify(m)+(m===val?" selected":"")+">"+fmtM(m)+"</option>";});
  return h+"</select>";
}
function sCard(lb,val,col,ic,sub){
  return "<div style='background:#fff;border-radius:12px;padding:1rem 1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:3px solid "+col+"'>"
    +"<div style='display:flex;justify-content:space-between;align-items:flex-start'>"
    +"<div><div style='font-size:11px;color:#888;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px'>"+lb+"</div>"
    +"<div style='font-size:20px;font-weight:800;color:"+col+"'>"+esc(val)+"</div>"
    +(sub?"<div style='font-size:11px;color:#aaa;margin-top:2px'>"+esc(sub)+"</div>":"")+"</div>"
    +(ic?"<i class='ti "+ic+"' style='font-size:26px;color:"+col+";opacity:.15'></i>":"")
    +"</div></div>";
}

// NAV
var sbOpen=true,pg="dashboard",CH={};
function killCH(){Object.values(CH).forEach(function(c){try{c.destroy();}catch(e){}});CH={};}
function go(p){
  killCH();
  document.querySelectorAll(".page").forEach(function(x){x.classList.remove("active");});
  document.querySelectorAll(".nb").forEach(function(x){x.classList.remove("on");});
  document.getElementById("p-"+p).classList.add("active");
  document.getElementById("nb-"+p).classList.add("on");
  pg=p;
  ({dashboard:rDash,centros:rCC,employees:rEmp,"5s":r5S,lancamento:rLanc,premios:rPrem,indices:rIdx,motivos:rMotivos,relatorio:rRel})[p]();
}
function toggleSB(){
  sbOpen=!sbOpen;
  document.getElementById("sb").classList.toggle("col",!sbOpen);
  document.querySelectorAll(".nl").forEach(function(el){el.style.display=sbOpen?"":"none";});
  document.getElementById("sbt").style.display=sbOpen?"":"none";
  document.getElementById("sbic").className=sbOpen?"ti ti-chevron-left":"ti ti-chevron-right";
}
function doLogin(){
  var u=document.getElementById("lu").value,p=document.getElementById("lp").value;
  if(u==="admin"&&p==="eleve2024"){
    document.getElementById("lgw").style.display="none";
    document.getElementById("app").style.display="flex";
    go("dashboard");

// DASHBOARD
function rDash(){
  var selAno=document.getElementById("dash-ano")&&document.getElementById("dash-ano").value||String(new Date().getFullYear());
  var selMes=document.getElementById("dash-mes")&&document.getElementById("dash-mes").value||curMes();
  var modo=document.getElementById("dash-modo")&&document.getElementById("dash-modo").value||"mes"; // "mes" ou "ano"

  // Build year options
  var anos={};DB.oc.forEach(function(o){anos[gmk(o.data).split("-")[0]]=1;});DB.pr.forEach(function(p){});
  var anoAtual=String(new Date().getFullYear());anos[anoAtual]=1;
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  // Testa se uma data cai dentro do periodo selecionado (mes especifico ou o ano inteiro)
  function noPeriodo(dataStr){
    return modo==="ano"?gmk(dataStr).split("-")[0]===selAno:gmk(dataStr)===selMes;
  }

  // Build annual data - usa apenas os meses que realmente possuem lancamentos (ocorrencias) no ano,
  // em vez de forcar Jan-Dez inteiro (que gerava valores de premio "fantasma" em meses sem nenhum uso do sistema)
  var mesesComDado={};
  DB.oc.forEach(function(o){var m=gmk(o.data);if(m.split("-")[0]===selAno)mesesComDado[m]=1;});
  if(selAno===String(new Date().getFullYear()))mesesComDado[curMes()]=1; // sempre inclui o mes atual, mesmo sem lancamentos
  var meses12=Object.keys(mesesComDado).sort();
  var lblAnual=meses12.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aPago=[],aPerd=[],aFaltas=[],aAtrasos=[];
  meses12.forEach(function(mes){
    var p2=0,l2=0,f2=0,a2=0;
    DB.emp.forEach(function(e){
      var pr=DB.pr.find(function(x){return x.eid===e.id;});if(!pr)return;
      var d=calcDesc(e.id,mes,pr.val);p2+=d.rec;l2+=d.desc;f2+=d.f;a2+=d.a;
    });
    aPago.push(+p2.toFixed(2));aPerd.push(+l2.toFixed(2));aFaltas.push(f2);aAtrasos.push(a2);
  });

  // Stats para o periodo selecionado (mes ou ano acumulado)
  var tp=0,tl=0,tf=0,ta=0,ok=0;
  if(modo==="ano"){
    tp=aPago.reduce(function(a,b){return a+b;},0);
    tl=aPerd.reduce(function(a,b){return a+b;},0);
    tf=aFaltas.reduce(function(a,b){return a+b;},0);
    ta=aAtrasos.reduce(function(a,b){return a+b;},0);
    DB.emp.forEach(function(e){
      var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var perfeito=meses12.every(function(mes){return calcDesc(e.id,mes,p.val).pct===0;});
      if(perfeito)ok++;
    });
  }else{
    DB.emp.forEach(function(e){
      var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var d=calcDesc(e.id,selMes,p.val);
      tp+=d.rec;tl+=d.desc;tf+=d.f;ta+=d.a;if(d.pct===0)ok++;
    });
  }
  // Infracoes 5S = numero de lancamentos (eventos) no periodo, nao a quantidade de colaboradores afetados
  var ts=DB.oc5.filter(function(o){return noPeriodo(o.data);}).length;
  var ml=modo==="ano"?("Ano "+selAno+" (Acumulado)"):fmtM(selMes);
  var sufixo=modo==="ano"?"no Ano":"no Mes";

  // Ranking de Faltas e Atrasos no periodo (todos os colaboradores com ocorrencia, independente de ter premio cadastrado)
  var famap={},aamap={};
  DB.oc.forEach(function(o){
    if(!noPeriodo(o.data))return;
    if(o.tipo==="falta")famap[o.eid]=(famap[o.eid]||0)+1;
    else if(o.tipo==="atraso")aamap[o.eid]=(aamap[o.eid]||0)+1;
  });
  function mkRank(map){
    return Object.keys(map).map(function(eid){
      var e=DB.emp.find(function(x){return x.id===eid;});
      return{nome:e?e.nome:"Colaborador removido",count:map[eid]};
    }).sort(function(a,b){return b.count-a.count;});
  }
  var rankF=mkRank(famap),rankA=mkRank(aamap);
  function rankHTML(items,color,emptyMsg){
    if(items.length===0)return "<div style='color:#aaa;text-align:center;padding:1.5rem;font-size:12px'>"+emptyMsg+"</div>";
    var top=items.slice(0,10);
    var medals=["#e6a817","#9aa5b8","#b9714a"];
    return top.map(function(x,i){
      var badgeColor=i<3?medals[i]:color;
      return "<div style='display:flex;align-items:center;justify-content:space-between;padding:.5rem .25rem"+(i<top.length-1?";border-bottom:1px solid #f0f4fb":"")+"'>"
        +"<div style='display:flex;align-items:center;gap:10px;min-width:0'>"
        +"<span style='width:22px;height:22px;border-radius:50%;background:"+badgeColor+";color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0'>"+(i+1)+"</span>"
        +"<span style='font-weight:600;font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+esc(x.nome)+"</span></div>"
        +"<span style='background:"+color+"18;color:"+color+";border-radius:6px;padding:2px 10px;font-size:12px;font-weight:800;flex-shrink:0;margin-left:8px'>"+x.count+"</span>"

  document.getElementById("p-dashboard").innerHTML=

    +"</div>"
    +"<div style='display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #dde3f0;border-radius:8px;padding:.35rem .75rem'>"

    +["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"].map(function(m,i){
        var v=selAno+"-"+(i+1<10?"0"+(i+1):""+(i+1));

    +"</select></div>"

    +"</div></div>"

    // STAT CARDS
    +"<div class='ga' style='margin-bottom:1.25rem'>"
    +sCard("Colaboradores",DB.emp.length,B,"ti-users")
    +sCard("100% Premio "+sufixo,ok,GRN,"ti-star",ml)
    +sCard("Total Pago "+sufixo,fmtBRL(tp),BL,"ti-credit-card",ml)
    +sCard("Total Perdido "+sufixo,fmtBRL(tl),RED,"ti-trending-down",ml)
    +sCard("Faltas",tf,RED,"ti-calendar-x",ml)
    +sCard("Atrasos",ta,GLD,"ti-clock-x",ml)
    +sCard("Infracoes 5S",ts,PUR,"ti-alert-triangle",ml)
    +"</div>"

    // ANNUAL CHARTS
    +"<div style='display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem'>"
    +"<div class='card' style='padding:.875rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+GRN+";margin-bottom:.5rem'><i class='ti ti-trending-up' style='margin-right:4px'></i>Total Pago por Mes - "+selAno+"</div>"
    +"<div style='height:160px;position:relative'><canvas id='ch-anopago'></canvas></div></div>"
    +"<div class='card' style='padding:.875rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+RED+";margin-bottom:.5rem'><i class='ti ti-trending-down' style='margin-right:4px'></i>Total Perdido por Mes - "+selAno+"</div>"
    +"<div style='height:160px;position:relative'><canvas id='ch-anoperd'></canvas></div></div></div>"

    // FALTAS E ATRASOS ANUAL
    +"<div class='card' style='padding:.875rem;margin-bottom:1rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+B+";margin-bottom:.5rem'><i class='ti ti-report-analytics' style='margin-right:4px'></i>Faltas e Atrasos por Mes - "+selAno+"</div>"
    +"<div style='height:180px;position:relative'><canvas id='ch-anofa'></canvas></div></div>"

    // MOTIVO CHARTS
    +"<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem'>"
    +"<div class='card' style='padding:.875rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+RED+";margin-bottom:.5rem'><i class='ti ti-calendar-x' style='margin-right:4px'></i>Motivos de Faltas - "+ml+"</div>"
    +(DB.oc.filter(function(o){return o.tipo==="falta"&&noPeriodo(o.data);}).length===0
      ?"<div style='color:#aaa;text-align:center;padding:1rem;font-size:12px'>Sem faltas no periodo</div>"
      :"<div style='height:150px;position:relative'><canvas id='ch-fmot'></canvas></div>")+"</div>"
    +"<div class='card' style='padding:.875rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+GLD+";margin-bottom:.5rem'><i class='ti ti-clock-x' style='margin-right:4px'></i>Motivos de Atrasos - "+ml+"</div>"
    +(DB.oc.filter(function(o){return o.tipo==="atraso"&&noPeriodo(o.data);}).length===0
      ?"<div style='color:#aaa;text-align:center;padding:1rem;font-size:12px'>Sem atrasos no periodo</div>"
      :"<div style='height:150px;position:relative'><canvas id='ch-amot'></canvas></div>")+"</div>"
    +"<div class='card' style='padding:.875rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+PUR+";margin-bottom:.5rem'><i class='ti ti-alert-triangle' style='margin-right:4px'></i>5S por Senso - "+ml+"</div>"
    +(DB.oc5.filter(function(o){return noPeriodo(o.data);}).length===0
      ?"<div style='color:#aaa;text-align:center;padding:1rem;font-size:12px'>Sem infracoes 5S no periodo</div>"
      :"<div style='height:150px;position:relative'><canvas id='ch-smot'></canvas></div>")+"</div>"
    +"</div>"

    // RANKING FALTAS E ATRASOS
    +"<div class='g2' style='margin-top:1rem'>"
    +"<div class='card'>"
    +"<div style='font-weight:700;font-size:13px;color:"+RED+";margin-bottom:.75rem'><i class='ti ti-trophy' style='margin-right:4px'></i>Ranking de Faltas - "+ml+"</div>"
    +rankHTML(rankF,RED,"Sem faltas no periodo")
    +"</div>"
    +"<div class='card'>"
    +"<div style='font-weight:700;font-size:13px;color:"+GLD+";margin-bottom:.75rem'><i class='ti ti-trophy' style='margin-right:4px'></i>Ranking de Atrasos - "+ml+"</div>"
    +rankHTML(rankA,GLD,"Sem atrasos no periodo")
    +"</div>"
    +"</div>";

  // Annual paid chart
  var hasDL=typeof ChartDataLabels!=="undefined";
  var dlPlugins=hasDL?[ChartDataLabels]:[];
  CH.anopago=new Chart(document.getElementById("ch-anopago"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[{label:"Total Pago (R$)",data:aPago,backgroundColor:BL+"cc",borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtBRL(ctx.raw);}}},
        datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",color:BL,font:{size:9,weight:700},formatter:function(v){return fmtBRLInt(v);}}},
      scales:{y:{ticks:{callback:function(v){return fmtBRLInt(v);},font:{size:10}},grid:{color:"#f0f4fb"}},
              x:{ticks:{font:{size:10}},grid:{display:false}}}}});

  // Annual lost chart
  CH.anoperd=new Chart(document.getElementById("ch-anoperd"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[{label:"Total Perdido (R$)",data:aPerd,backgroundColor:RED+"cc",borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtBRL(ctx.raw);}}},
        datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",color:RED,font:{size:9,weight:700},formatter:function(v){return fmtBRLInt(v);}}},
      scales:{y:{ticks:{callback:function(v){return fmtBRLInt(v);},font:{size:10}},grid:{color:"#f0f4fb"}},
              x:{ticks:{font:{size:10}},grid:{display:false}}}}});

  // Annual Faltas/Atrasos chart
  CH.anofa=new Chart(document.getElementById("ch-anofa"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[
      {label:"Faltas",data:aFaltas,backgroundColor:RED+"cc",borderRadius:4,borderSkipped:false},
      {label:"Atrasos",data:aAtrasos,backgroundColor:GLD+"cc",borderRadius:4,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"top",labels:{boxWidth:10,font:{size:10},padding:6}},

      scales:{y:{beginAtZero:true,ticks:{precision:0,font:{size:10}},grid:{color:"#f0f4fb"}},
              x:{ticks:{font:{size:10}},grid:{display:false}}}}});

  // Motivo pie helper
  function mkBreakdown(ocs,getLabel,getColor){
    var map={};
    ocs.forEach(function(o){var lb=getLabel(o);map[lb]=(map[lb]||0)+1;});
    var lbs=Object.keys(map),vals=lbs.map(function(k){return map[k];});
    var cols=lbs.map(function(lb,i){return getColor(lb,i);});
    return{labels:lbs,values:vals,colors:cols};
  }
  function mkPieFromBreakdown(cid,bd){
    if(bd.labels.length===0||!document.getElementById(cid))return null;
    return new Chart(document.getElementById(cid),{type:"doughnut",
      plugins:dlPlugins,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:bd.colors,borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10},padding:4}},
        tooltip:{callbacks:{label:function(ctx){return ctx.label+": "+ctx.raw;}}},

  var aOcs=DB.oc.filter(function(o){return o.tipo==="atraso"&&noPeriodo(o.data);});

  var sEvts=DB.oc5.filter(function(o){return noPeriodo(o.data);});

  );

  CH.amot=mkPieFromBreakdown("ch-amot",bdAtrasos);
  CH.smot=mkPieFromBreakdown("ch-smot",bd5S);

  // Guarda os dados ja calculados para o gerador de Relatorio PDF reaproveitar (inclui dados brutos dos graficos)
  window._dashStats={selAno:selAno,selMes:selMes,modo:modo,ml:ml,sufixo:sufixo,tp:tp,tl:tl,tf:tf,ta:ta,ts:ts,ok:ok,rankF:rankF,rankA:rankA,

    motFaltas:bdFaltas,motAtrasos:bdAtrasos,sensos5S:bd5S};
}
function setDashModo(m){

// ═══════════════════════════════════════
// RELATORIO PDF DO DASHBOARD (2 folhas A4)
// ═══════════════════════════════════════
function gerarRelatorioPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._dashStats;
  if(!st){alert("Abra o Dashboard antes de gerar o relatorio.");return;}
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var pageW=297,pageH=210,mg=13,cw=pageW-mg*2;
  var rgbB=[26,58,107],rgbBL=[46,92,168],rgbRED=[192,57,43],rgbGRN=[26,122,74],rgbGLD=[230,168,23],rgbPUR=[123,63,160],rgbLine=[228,233,244];
  var BANDH=25,PXSCALE=7;

  function rgba(rgb,a){return "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+(a===undefined?1:a)+")";}

  // ---- Elementos base reutilizaveis ----
  function panel(x,y,w,h){
    doc.setFillColor(255,255,255);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.35);
    doc.roundedRect(x,y,w,h,2,2,"FD");
  }
  function header(titulo){
    doc.setFillColor(rgbB[0],rgbB[1],rgbB[2]);
    doc.rect(0,0,pageW,BANDH,"F");
    doc.setFillColor(rgbGLD[0],rgbGLD[1],rgbGLD[2]);
    doc.rect(0,BANDH,pageW,1,"F");
    doc.setFillColor(255,255,255);
    doc.circle(mg+5.5,BANDH/2,5.5,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setTextColor(rgbB[0],rgbB[1],rgbB[2]);
    doc.text("E",mg+5.5,BANDH/2+2.2,{align:"center"});
    doc.setFont("helvetica","bold");doc.setFontSize(15);
    doc.setTextColor(255,255,255);
    doc.text("ELEVE",mg+15,11);
    doc.setFont("helvetica","normal");doc.setFontSize(7.5);
    doc.setTextColor(215,224,242);
    doc.text("Telhas Metalicas  -  Gestao de Premios",mg+15,16.5);
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setTextColor(255,255,255);
    doc.text(titulo,pageW-mg,10.5,{align:"right"});
    var agora=new Date();
    var dataStr=agora.toLocaleDateString("pt-BR")+" as "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    doc.setFont("helvetica","normal");doc.setFontSize(8);
    doc.setTextColor(215,224,242);
    doc.text("Periodo: "+st.ml,pageW-mg,16,{align:"right"});
    doc.setFontSize(7);doc.setTextColor(180,195,225);
    doc.text("Gerado em "+dataStr,pageW-mg,20.5,{align:"right"});
    return BANDH+9;
  }
  function footer(pagNum){
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.3);
    doc.line(mg,pageH-10,pageW-mg,pageH-10);
    doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(165,165,165);
    doc.text("Eleve - Sistema de Gestao de Premios",mg,pageH-6);
    doc.text("Documento gerado automaticamente pelo sistema",pageW/2,pageH-6,{align:"center"});
    doc.text("Pagina "+pagNum+"/2",pageW-mg,pageH-6,{align:"right"});
  }
  function sectionLabel(txt,x,y,rgb){
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y-3.2,2.2,2.2,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(10.5);
    doc.setTextColor(50,50,50);
    doc.text(txt,x+4.5,y);
  }
  function statCard(x,y,w,h,lb,val,rgb){
    panel(x,y,w,h);
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y,w,1.1,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(6.8);
    doc.setTextColor(130,130,130);
    doc.text(String(lb).toUpperCase(),x+3,y+7.5);
    doc.setFont("helvetica","bold");doc.setFontSize(12.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(String(val),x+3,y+15.5);
  }
  // Painel que recebe uma imagem de grafico JA renderizada no tamanho exato da area util (sem sobra/distorcao)
  function chartPanel(imgDataUrl,x,y,w,h,titulo,rgb){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(titulo,x+4,y+6.5);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.25);
    doc.line(x+4,y+8.5,x+w-4,y+8.5);
    var areaX=x+4,areaY=y+11,areaW=w-8,areaH=h-14;
    if(!imgDataUrl){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem dados no periodo",x+w/2,y+h/2,{align:"center"});
      return;
    }
    doc.addImage(imgDataUrl,"PNG",areaX,areaY,areaW,areaH);
  }
  function rankPanel(x,y,w,h,title,items,rgb,colLabel){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(title,x+4,y+6.5);
    var tx=x+4,tw=w-8,rowH=5.6,yy=y+9.5;
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(tx,yy,tw,rowH,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(7.3);doc.setTextColor(255,255,255);
    doc.text("#",tx+2.5,yy+3.8);
    doc.text("Colaborador",tx+9,yy+3.8);
    doc.text(colLabel,tx+tw-2.5,yy+3.8,{align:"right"});
    yy+=rowH;
    var maxRows=Math.max(1,Math.floor((h-(yy-y)-3)/rowH));
    var top=items.slice(0,Math.min(10,maxRows));
    if(top.length===0){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem ocorrencias no periodo",tx+2.5,yy+4);
      return;
    }
    top.forEach(function(it,i){
      if(i%2===1){doc.setFillColor(248,250,255);doc.rect(tx,yy,tw,rowH,"F");}
      doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(70,70,70);
      doc.text(String(i+1),tx+2.5,yy+3.8);
      var nomeShort=it.nome.length>36?it.nome.slice(0,34)+"...":it.nome;
      doc.text(nomeShort,tx+9,yy+3.8);
      doc.setFont("helvetica","bold");doc.setTextColor(rgb[0],rgb[1],rgb[2]);
      doc.text(String(it.count),tx+tw-2.5,yy+3.8,{align:"right"});
      yy+=rowH;
    });
  }

  // ---- Geracao de graficos em canvas temporario (fora da tela), no tamanho EXATO da area do painel ----
  // Isso garante que a imagem preencha o quadrado inteiro, sem sobra branca nem distorcao.
  function tempCanvas(pxW,pxH){
    var cv=document.createElement("canvas");
    cv.width=pxW;cv.height=pxH;
    cv.style.position="fixed";cv.style.left="-99999px";cv.style.top="0";
    document.body.appendChild(cv);
    return cv;
  }
  var dlP=(typeof ChartDataLabels!=="undefined")?[ChartDataLabels]:[];
  function renderOffscreen(cfg,areaW,areaH){
    var pxW=Math.max(50,Math.round(areaW*PXSCALE)),pxH=Math.max(50,Math.round(areaH*PXSCALE));
    var cv=tempCanvas(pxW,pxH);
    var ch=new Chart(cv,cfg);
    var img=ch.toBase64Image();
    ch.destroy();cv.remove();
    return img;
  }
  function doughnutImg(bd,areaW,areaH){
    if(!bd||!bd.labels||bd.labels.length===0)return null;
    return renderOffscreen({type:"doughnut",plugins:dlP,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:bd.colors,borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:false,animation:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:16,font:{size:15},padding:10}},
          datalabels:{color:"#fff",font:{size:15,weight:700},formatter:function(v){return v;}}}}
    },areaW,areaH);
  }
  function barImg(labels,datasets,areaW,areaH,money){
    if(!labels||labels.length===0)return null;
    return renderOffscreen({type:"bar",plugins:dlP,
      data:{labels:labels,datasets:datasets},
      options:{responsive:false,animation:false,
        plugins:{legend:{display:datasets.length>1,position:"top",labels:{boxWidth:14,font:{size:14},padding:8}},
          datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",
            color:function(ctx){return ctx.dataset.borderColor;},font:{size:12,weight:700},
            formatter:function(v){return money?fmtBRLInt(v):v;}}},
        scales:{y:{beginAtZero:true,ticks:{font:{size:13},precision:money?2:0,callback:money?function(v){return fmtBRLInt(v);}:undefined},grid:{color:"#eef1f8"}},
                x:{ticks:{font:{size:13}},grid:{display:false}}}}
    },areaW,areaH);
  }

  // ===== PAGINA 1 - VISAO GERAL =====
  var tituloModo=st.modo==="ano"?"Relatorio Anual (Acumulado)":"Relatorio Mensal";
  var y=header(tituloModo);

  sectionLabel("Indicadores - "+st.ml,mg,y,rgbB);
  y+=4;
  var statsArr=[
    {lb:"Colaboradores",val:String(DB.emp.length),rgb:rgbB},
    {lb:"100% Premio "+st.sufixo,val:String(st.ok),rgb:rgbGRN},
    {lb:"Total Pago "+st.sufixo,val:fmtBRL(st.tp),rgb:rgbBL},
    {lb:"Total Perdido "+st.sufixo,val:fmtBRL(st.tl),rgb:rgbRED},
    {lb:"Faltas",val:String(st.tf),rgb:rgbRED},
    {lb:"Atrasos",val:String(st.ta),rgb:rgbGLD},
    {lb:"Infracoes 5S",val:String(st.ts),rgb:rgbPUR}
  ];
  var gap=3.5,cardW=(cw-6*gap)/7,cardH=20;
  statsArr.forEach(function(s,i){
    statCard(mg+i*(cardW+gap),y,cardW,cardH,s.lb,s.val,s.rgb);
  });
  y+=cardH+9;

  sectionLabel("Evolucao Anual - "+st.selAno,mg,y,rgbB);
  y+=4;
  var colW=(cw-2*gap)/3,chartH=Math.min(105,pageH-10-y-4);
  var areaW1=colW-8,areaH1=chartH-14;
  var imgPago=barImg(st.lblAnual,[{label:"Total Pago",data:st.aPago,backgroundColor:rgba(rgbGRN,.82),borderColor:rgba(rgbGRN,1),borderRadius:4}],areaW1,areaH1,true);
  var imgPerd=barImg(st.lblAnual,[{label:"Total Perdido",data:st.aPerd,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4}],areaW1,areaH1,true);
  var imgFA=barImg(st.lblAnual,[
    {label:"Faltas",data:st.aFaltas,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4},
    {label:"Atrasos",data:st.aAtrasos,backgroundColor:rgba(rgbGLD,.82),borderColor:rgba(rgbGLD,1),borderRadius:4}
  ],areaW1,areaH1,false);
  chartPanel(imgPago,mg,y,colW,chartH,"Total Pago por Mes",rgbGRN);
  chartPanel(imgPerd,mg+colW+gap,y,colW,chartH,"Total Perdido por Mes",rgbRED);
  chartPanel(imgFA,mg+2*(colW+gap),y,colW,chartH,"Faltas e Atrasos por Mes",rgbB);

  footer(1);

  // ===== PAGINA 2 - MOTIVOS E RANKINGS =====
  doc.addPage();
  y=header(tituloModo);

  sectionLabel("Motivos das Ocorrencias - "+st.ml,mg,y,rgbB);
  y+=4;
  var motH=72;
  var areaW2=colW-8,areaH2=motH-14;
  var imgFmot=doughnutImg(st.motFaltas,areaW2,areaH2);
  var imgAmot=doughnutImg(st.motAtrasos,areaW2,areaH2);
  var imgSmot=doughnutImg(st.sensos5S,areaW2,areaH2);
  chartPanel(imgFmot,mg,y,colW,motH,"Motivos de Faltas",rgbRED);
  chartPanel(imgAmot,mg+colW+gap,y,colW,motH,"Motivos de Atrasos",rgbGLD);
  chartPanel(imgSmot,mg+2*(colW+gap),y,colW,motH,"5S por Senso",rgbPUR);
  y+=motH+9;

  sectionLabel("Rankings - "+st.ml,mg,y,rgbB);
  y+=4;
  var rankW=(cw-gap)/2,rankH=Math.min(72,pageH-10-y-4);
  rankPanel(mg,y,rankW,rankH,"Ranking de Faltas",st.rankF,rgbRED,"Faltas");
  rankPanel(mg+rankW+gap,y,rankW,rankH,"Ranking de Atrasos",st.rankA,rgbGLD,"Atrasos");

  footer(2);

  doc.save("relatorio-dashboard-"+(st.modo==="ano"?st.selAno:st.selMes)+".pdf");
}

function rCCList(list){
  if(list.length===0)return "<div style='color:#aaa;font-size:13px;text-align:center;padding:2rem'><i class='ti ti-building' style='font-size:32px;display:block;margin-bottom:8px;opacity:.3'></i>Nenhum centro cadastrado.</div>";
  return list.map(function(cc){
    var cnt=DB.emp.filter(function(e){return e.ccid===cc.id;}).length;
    return "<div style='border-bottom:1px solid #f0f4fb;padding:.75rem 0;display:flex;justify-content:space-between;align-items:center'>"
      +"<div style='min-width:0'>"
      +"<div style='display:flex;align-items:center;gap:8px;margin-bottom:2px'>"
      +"<span style='background:#e8f0fb;color:"+B+";border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;flex-shrink:0'>"+esc(cc.cod)+"</span>"
      +"<span style='font-weight:700;font-size:14px'>"+esc(cc.desc)+"</span></div>"
      +(cc.resp?"<div style='font-size:11px;color:#888'>"+esc(cc.resp)+"</div>":"")
      +(cc.obs?"<div style='font-size:11px;color:#aaa'>"+esc(cc.obs)+"</div>":"")
      +"<div style='font-size:11px;color:"+BL+";font-weight:600'>"+cnt+" colaborador"+(cnt!==1?"es":"")+"</div></div>"
      +"<div style='display:flex;gap:4px;flex-shrink:0'>"
      +"<button class='ibedt' data-fn='edtCC' data-id='"+cc.id+"'><i class='ti ti-edit'></i></button>"
      +"<button class='ibdel' data-fn='delCC' data-id='"+cc.id+"'><i class='ti ti-trash'></i></button>"
      +"</div></div>";
  }).join("");
}
function filtCC(){
  var q=(document.getElementById("ccbsc").value||"").toLowerCase();
  document.getElementById("cclist").innerHTML=rCCList(DB.cc.filter(function(cc){
    return cc.cod.toLowerCase().includes(q)||cc.desc.toLowerCase().includes(q)||(cc.resp||"").toLowerCase().includes(q);
  }));
}
function savCC(){
  var id=document.getElementById("cceid").value;
  var cod=document.getElementById("cccod").value.trim();
  var desc=document.getElementById("ccdesc").value.trim();
  var resp=document.getElementById("ccresp").value.trim();
  var obs=document.getElementById("ccobs").value.trim();
  if(!cod||!desc){alert("Preencha codigo e descricao.");return;}
  if(DB.cc.find(function(x){return x.cod.toLowerCase()===cod.toLowerCase()&&x.id!==id;})){alert("Codigo ja existe.");return;}
  var obj={id:id||uid(),cod:cod,desc:desc,resp:resp,obs:obs};
  if(id){DB.cc=DB.cc.map(function(x){return x.id===id?obj:x;});}else{DB.cc.push(obj);}
  dbSave();canCC();rCC();
}
function edtCC(id){
  var cc=DB.cc.find(function(x){return x.id===id;});if(!cc)return;
  document.getElementById("cceid").value=id;
  document.getElementById("cccod").value=cc.cod;
  document.getElementById("ccdesc").value=cc.desc;
  document.getElementById("ccresp").value=cc.resp||"";
  document.getElementById("ccobs").value=cc.obs||"";
  document.getElementById("ccft").textContent="Editar centro";
  document.getElementById("cccb").style.display="";
  document.querySelector("#p-centros .btnp").textContent="Salvar alteracoes";
}
function canCC(){
  ["cceid","cccod","ccdesc","ccresp","ccobs"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("ccft").textContent="Novo centro de custo";
  document.getElementById("cccb").style.display="none";
  var btn=document.querySelector("#p-centros .btnp");if(btn)btn.textContent="Cadastrar";
}
function delCC(id){
  var cnt=DB.emp.filter(function(e){return e.ccid===id;}).length;
  var msg=cnt>0?"Centro possui "+cnt+" colaborador"+(cnt!==1?"es":"")+". Remover mesmo assim?":"Remover este centro?";
  if(!confirm(msg))return;
  DB.cc=DB.cc.filter(function(x){return x.id!==id;});
  DB.emp=DB.emp.map(function(e){return e.ccid===id?Object.assign({},e,{ccid:""}):e;});
  dbSave();rCC();
}

// LANCAMENTOS
var lancT="falta";
function rLanc(){
  var sE=document.getElementById("lfe")&&document.getElementById("lfe").value||"";
  var sT=document.getElementById("lft")&&document.getElementById("lft").value||"";
  var sM=document.getElementById("lfm")&&document.getElementById("lfm").value||curMes();
  var fil=DB.oc.filter(function(o){return(!sE||o.eid===sE)&&(!sT||o.tipo===sT)&&(!sM||gmk(o.data)===sM);}).sort(function(a,b){return b.data.localeCompare(a.data);});
  var ms=getMeses();
  var empOpts="<option value=''>Selecione...</option>";
  DB.emp.forEach(function(e){empOpts+="<option value='"+e.id+"'>"+esc(e.nome)+(e.dem?" (Dem. "+e.dem+")":"")+"</option>";});
  var tBtns="";

function setTipo(t){

  });

function savLanc(){
  var eid=document.getElementById("lemp").value,data=document.getElementById("ldata").value,obs=document.getElementById("lobs").value,motivo_id=document.getElementById("lmotivo")&&document.getElementById("lmotivo").value||"";
  if(!eid||!data){alert("Selecione colaborador e data.");return;}
  var emp=DB.emp.find(function(e){return e.id===eid;});
  if(emp&&emp.dem&&gmk(data)>gmk(emp.dem)){alert("Colaborador demitido em "+emp.dem+". Nao e possivel lancar para "+fmtM(gmk(data))+".");return;}
  DB.oc.push({id:uid(),eid:eid,tipo:lancT,data:data,obs:obs,motivo_id:motivo_id});
  dbSave();document.getElementById("lemp").value="";document.getElementById("lobs").value="";rLanc();
}

function savEdtLanc(id){
  var tipo=document.getElementById("ettipo").value,data=document.getElementById("etdata").value,obs=document.getElementById("etobs").value;

  var o=DB.oc.find(function(x){return x.id===id;});
  var emp=DB.emp.find(function(e){return e.id===o.eid;});
  if(emp&&emp.dem&&gmk(data)>gmk(emp.dem)){alert(emp.nome+" foi demitido em "+emp.dem+". Data invalida.");return;}

  if(bf){if(t==="falta"){bf.style.borderColor=RED;bf.style.background=RED+"18";bf.style.color=RED;}else{bf.style.borderColor="#dde3f0";bf.style.background="#fff";bf.style.color="#777";}}

  // Update motivo list select
  var sel=document.getElementById("mot-tipo");if(sel)sel.value=t;
}
function savMot(){
  var id=document.getElementById("mot-id").value;
  var tipo=document.getElementById("mot-tipo-sel").value;
  var nome=document.getElementById("mot-nome").value.trim();
  var desc=document.getElementById("mot-desc").value.trim();
  if(!nome){alert("Informe o nome do motivo.");return;}
  var obj={id:id||uid(),tipo:tipo,nome:nome,desc:desc};
  if(id){DB.motivos=DB.motivos.map(function(x){return x.id===id?obj:x;});}else{DB.motivos.push(obj);}
  dbSave();canMot();rMotivos();
}
function edtMot(id){
  var m=DB.motivos.find(function(x){return x.id===id;});if(!m)return;
  document.getElementById("mot-id").value=id;
  document.getElementById("mot-nome").value=m.nome;
  document.getElementById("mot-desc").value=m.desc||"";
  document.getElementById("mot-ft").textContent="Editar motivo";
  document.getElementById("mot-cb").style.display="";
  document.querySelector("#p-motivos .btnp").textContent="Salvar alteracoes";
  setMotTipo(m.tipo);
}
function canMot(){
  ["mot-id","mot-nome","mot-desc"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("mot-ft").textContent="Novo motivo";
  document.getElementById("mot-cb").style.display="none";
  var btn=document.querySelector("#p-motivos .btnp");if(btn)btn.textContent="Cadastrar";
}
function delMot(id){
  if(!confirm("Remover este motivo?"))return;

}

var s5Modo="geral";
function setModo5S(m){
  s5Modo=m;
  var el=document.getElementById("s5modo");if(el)el.value=m;
  var bgeral=document.getElementById("s5mgeral"),bcc=document.getElementById("s5mcc");
  var ccrow=document.getElementById("s5ccrow");
  if(m==="geral"){
    if(bgeral){bgeral.style.borderColor=RED;bgeral.style.background=RED+"18";bgeral.style.color=RED;}
    if(bcc){bcc.style.borderColor="#dde3f0";bcc.style.background="#fff";bcc.style.color="#777";}
    if(ccrow)ccrow.style.display="none";
  }else{
    if(bcc){bcc.style.borderColor=BL;bcc.style.background=BL+"18";bcc.style.color=BL;}
    if(bgeral){bgeral.style.borderColor="#dde3f0";bgeral.style.background="#fff";bgeral.style.color="#777";}
    if(ccrow)ccrow.style.display="";
    var sel=document.getElementById("s5cc");
    if(sel)sel.addEventListener("change",upd5SPreview);
  }
  upd5SPreview();
}
function upd5SPreview(){
  var pl=document.getElementById("s5prevlist");if(!pl)return;
  var modo=document.getElementById("s5modo")&&document.getElementById("s5modo").value||"geral";
  var ccid=document.getElementById("s5cc")&&document.getElementById("s5cc").value||"";
  var emps;
  if(modo==="geral"){emps=DB.emp;}
  else{emps=ccid?DB.emp.filter(function(e){return e.ccid===ccid;}):[]; }
  if(emps.length===0){pl.innerHTML="<span style='color:#aaa'>Nenhum colaborador"+(modo==="cc"&&!ccid?" (selecione um centro)":"")+"</span>";return;}
  pl.innerHTML="<strong style='color:"+B+"'>"+emps.length+"</strong> colaborador"+(emps.length!==1?"es":"")+" afetado"+(emps.length!==1?"s":"")+":<br/>"
    +"<div style='display:flex;flex-wrap:wrap;gap:3px;margin-top:4px'>"
    +emps.map(function(e){return "<span style='background:#e8f0fb;color:"+B+";border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600'>"+esc(e.nome.split(" ")[0])+"</span>";}).join("")
    +"</div>";
}
function sav5S(){
  var id=document.getElementById("s5id").value;
  var modo=document.getElementById("s5modo").value;
  var ccid=document.getElementById("s5cc")&&document.getElementById("s5cc").value||"";
  var data=document.getElementById("s5data").value;
  var obs=document.getElementById("s5obs").value.trim();
  if(!data){alert("Informe a data.");return;}
  if(modo==="cc"&&!ccid){alert("Selecione o centro de custo.");return;}
  // Determine affected employees
  var emps;
  if(modo==="geral"){emps=DB.emp;}
  else{emps=DB.emp.filter(function(e){return e.ccid===ccid;});}
  if(emps.length===0){alert("Nenhum colaborador afetado. Verifique o centro de custo.");return;}
  var s5senso=document.getElementById("s5senso")&&document.getElementById("s5senso").value||"";
  var obj={id:id||uid(),modo:modo,ccid:modo==="cc"?ccid:"",data:data,obs:obs,senso_id:s5senso};
  if(id){
    DB.oc5=DB.oc5.map(function(x){return x.id===id?obj:x;});
    // Remove old 5S ocorrencias for this lancamento and re-add
    DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  }else{
    DB.oc5.push(obj);
  }
  // Add individual ocorrencias for each affected employee
  emps.forEach(function(e){
    DB.oc.push({id:uid(),eid:e.id,tipo:"5s",data:data,obs:obs,s5ref:obj.id,senso_id:s5senso});
  });
  dbSave();can5S();r5S();
}
function edt5S(id){
  var o=DB.oc5.find(function(x){return x.id===id;});if(!o)return;
  document.getElementById("s5id").value=id;
  document.getElementById("s5modo").value=o.modo;
  document.getElementById("s5data").value=o.data;
  document.getElementById("s5obs").value=o.obs||"";
  document.getElementById("s5ft").textContent="Editar infracao 5S";
  document.getElementById("s5cb").style.display="";
  document.querySelector("#p-5s .btnp").textContent="Salvar alteracoes";
  s5Modo=o.modo;setModo5S(o.modo);
  if(o.modo==="cc"){var cc=document.getElementById("s5cc");if(cc)cc.value=o.ccid||"";}
  upd5SPreview();
}
function can5S(){
  document.getElementById("s5id").value="";
  document.getElementById("s5data").value=new Date().toISOString().slice(0,10);
  document.getElementById("s5obs").value="";
  document.getElementById("s5ft").textContent="Nova infracao 5S";
  document.getElementById("s5cb").style.display="none";
  var btn=document.querySelector("#p-5s .btnp");if(btn)btn.textContent="Lancar Infracao 5S";
  s5Modo="geral";setModo5S("geral");
}
function del5S(id){
  if(!confirm("Remover esta infracao 5S e todos os descontos vinculados?"))return;
  DB.oc5=DB.oc5.filter(function(x){return x.id!==id;});
  DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  dbSave();r5S();
}

function rIdx(){
  var hj=hoje(),tBtns="";
  TIPOS.forEach(function(t){
    var on=idxT===t.k;
    tBtns+="<button id='ib"+t.k+"' data-tipo='"+t.k+"' onclick='setIdxT(this.dataset.tipo)' style='padding:.55rem .25rem;border:2px solid "+(on?t.co:"#dde3f0")+";border-radius:8px;background:"+(on?t.co+"18":"#fff")+";color:"+(on?t.co:"#777")+";font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s'><i class='ti "+t.ic+"' style='font-size:20px'></i>"+t.lb+"</button>";
  });
  var listH=DB.idx.length===0?"<div style='color:#aaa;font-size:13px;text-align:center;padding:1.5rem'><i class='ti ti-adjustments' style='font-size:32px;display:block;margin-bottom:8px;opacity:.3'></i>Nenhum indice. Padrao: Falta 15% &middot; Atraso 5% &middot; 5S 10%</div>":"";
  TIPOS.forEach(function(t){
    var ti=DB.idx.filter(function(i){return i.tipo===t.k;}).sort(function(a,b){return b.ini.localeCompare(a.ini);});
    if(ti.length===0)return;
    listH+="<div style='margin-bottom:1rem'><div style='display:flex;align-items:center;gap:6px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #f0f4fb'>"
      +"<i class='ti "+t.ic+"' style='font-size:15px;color:"+t.co+"'></i><span style='font-size:12px;font-weight:700;color:"+t.co+"'>"+t.lb+"</span></div>";
    ti.forEach(function(idx){
      var atv=idx.ini<=hj&&(!idx.fim||idx.fim>=hj);
      listH+="<div style='display:flex;justify-content:space-between;align-items:center;padding:.5rem .65rem;border-radius:8px;margin-bottom:4px;background:"+(atv?t.co+"10":"#f8f8f8")+";border:1px solid "+(atv?t.co+"30":"#eee")+"'>"
        +"<div><span style='font-size:15px;font-weight:800;color:"+t.co+"'>"+idx.pct+"%</span><span style='font-size:12px;color:#888;margin-left:6px'>por ocorrencia</span>"
        +(atv?"<span style='background:"+t.co+";color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:6px'>ATIVO</span>":"")
        +"<div style='font-size:11px;color:#aaa;margin-top:2px'>"+idx.ini+(idx.fim?" &rarr; "+idx.fim:" &rarr; sem fim")+(idx.obs?" &middot; "+esc(idx.obs):"")+"</div></div>"
        +"<div style='display:flex;gap:4px;flex-shrink:0'>"
        +"<button class='ibedt' data-fn='edtIdx' data-id='"+idx.id+"'><i class='ti ti-edit'></i></button>"
        +"<button class='ibdel' data-fn='delIdx' data-id='"+idx.id+"'><i class='ti ti-trash'></i></button>"
        +"</div></div>";
    });
    listH+="</div>";
  });
  document.getElementById("p-indices").innerHTML=
    "<h1 style='font-size:22px;font-weight:800;color:"+B+";margin-bottom:.25rem'>Indices de Desconto</h1>"
    +"<div style='font-size:13px;color:#888;margin-bottom:1.5rem'>Configure os percentuais por tipo e vigencia</div>"
    +"<div class='g2' style='align-items:start'>"
    +"<div class='card'>"
    +"<div style='font-weight:700;font-size:15px;color:"+B+";margin-bottom:1rem' id='ixft'>Novo indice</div>"
    +"<input type='hidden' id='ixid'/>"
    +"<div class='fr'><label class='lbl'>Tipo de ocorrencia</label>"
    +"<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px'>"+tBtns+"</div>"
    +"<input type='hidden' id='ixtipo' value='"+idxT+"'/></div>"
    +"<div class='fr'><label class='lbl'>% de desconto por ocorrencia</label>"
    +"<div style='display:flex;align-items:center;gap:8px'><input type='number' id='ixpct' min='1' max='100' step='1' placeholder='Ex: 15' style='max-width:100px'/><span style='font-size:13px;color:#888'>% do premio</span></div></div>"
    +"<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.875rem'>"
    +"<div><label class='lbl'>Inicio da vigencia</label><input type='date' id='ixini'/></div>"
    +"<div><label class='lbl'>Fim <span style='color:#bbb;font-weight:400;text-transform:none'>(vazio = sem fim)</span></label><input type='date' id='ixfim'/></div></div>"
    +"<div class='fr'><label class='lbl'>Descricao <span style='color:#bbb;font-weight:400;text-transform:none'>(opcional)</span></label><input type='text' id='ixobs' placeholder='Ex: Regra semestre 1'/></div>"
    +"<div style='display:flex;gap:8px'><button class='btnp' style='flex:1' onclick='savIdx()'>Salvar indice</button>"
    +"<button class='btng' id='ixcb' style='display:none' onclick='canIdx()'>Cancelar</button></div></div>"
    +"<div class='card'><div style='font-weight:700;font-size:15px;color:"+B+";margin-bottom:.875rem'>Indices cadastrados "
    +"<span style='font-size:12px;color:#aaa;font-weight:400'>("+DB.idx.length+" registro"+(DB.idx.length!==1?"s":"")+")</span></div>"
    +listH
    +"<div style='margin-top:.75rem;padding:.65rem;background:#f0f4fb;border-radius:8px;font-size:11px;color:#888'>"
    +"<i class='ti ti-info-circle' style='margin-right:4px'></i>Sem indice: usa padrao Falta 15% &middot; Atraso 5% &middot; 5S 10%</div>"
    +"</div></div>";
}
function setIdxT(t){
  idxT=t;var el=document.getElementById("ixtipo");if(el)el.value=t;
  TIPOS.forEach(function(ti){
    var btn=document.getElementById("ib"+ti.k);if(!btn)return;
    if(ti.k===t){btn.style.borderColor=ti.co;btn.style.background=ti.co+"18";btn.style.color=ti.co;}
    else{btn.style.borderColor="#dde3f0";btn.style.background="#fff";btn.style.color="#777";}
  });
}
function savIdx(){
  var id=document.getElementById("ixid").value,tipo=document.getElementById("ixtipo").value;
  var pct=parseFloat(document.getElementById("ixpct").value),ini2=document.getElementById("ixini").value;
  var fim=document.getElementById("ixfim").value,obs=document.getElementById("ixobs").value.trim();
  if(!tipo||isNaN(pct)||pct<=0||!ini2){alert("Preencha tipo, % e inicio.");return;}
  if(fim&&fim<ini2){alert("Fim nao pode ser anterior ao inicio.");return;}
  var obj={id:id||uid(),tipo:tipo,pct:pct,ini:ini2,fim:fim,obs:obs};
  if(id){DB.idx=DB.idx.map(function(x){return x.id===id?obj:x;});}else{DB.idx.push(obj);}
  dbSave();canIdx();rIdx();
}
function edtIdx(id){
  var idx=DB.idx.find(function(x){return x.id===id;});if(!idx)return;
  document.getElementById("ixid").value=id;document.getElementById("ixtipo").value=idx.tipo;
  document.getElementById("ixpct").value=idx.pct;document.getElementById("ixini").value=idx.ini;
  document.getElementById("ixfim").value=idx.fim||"";document.getElementById("ixobs").value=idx.obs||"";
  document.getElementById("ixft").textContent="Editar indice";document.getElementById("ixcb").style.display="";
  document.querySelector("#p-indices .btnp").textContent="Salvar alteracoes";setIdxT(idx.tipo);
}
function canIdx(){
  ["ixid","ixpct","ixini","ixfim","ixobs"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("ixft").textContent="Novo indice";document.getElementById("ixcb").style.display="none";
  var btn=document.querySelector("#p-indices .btnp");if(btn)btn.textContent="Salvar indice";setIdxT("falta");
}
function delIdx(id){if(!confirm("Remover indice?"))return;DB.idx=DB.idx.filter(function(x){return x.id!==id;});dbSave();rIdx();}

// RELATORIOS
function rRel(){
  var sm=document.getElementById("rm")&&document.getElementById("rm").value||curMes();
  var se=document.getElementById("re")&&document.getElementById("re").value||"";
  var emps=se?DB.emp.filter(function(e){return e.id===se;}):DB.emp;
  var td=emps.map(function(emp){var pr=DB.pr.find(function(p){return p.eid===emp.id;});if(!pr)return{emp:emp,d:null,pr:null};return{emp:emp,d:calcDesc(emp.id,sm,pr.val),pr:pr};});
  var ml=fmtM(sm);
  var totP=td.reduce(function(s,x){return s+(x.pr?x.pr.val:0);},0);
  var totD=td.reduce(function(s,x){return s+(x.d?x.d.desc:0);},0);
  var totR=td.reduce(function(s,x){return s+(x.d?x.d.rec:0);},0);
  var eOpts="<option value=''>Todos</option>";DB.emp.forEach(function(e){eOpts+="<option value='"+e.id+"'"+(se===e.id?" selected":"")+">"+esc(e.nome)+"</option>";});
  var has=td.some(function(x){return x.d;});
  document.getElementById("p-relatorio").innerHTML=
    "<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px'>"
    +"<div><h1 style='font-size:22px;font-weight:800;color:"+B+"'>Relatorio - Pagamento Cartao</h1>"
    +"<div style='font-size:13px;color:#888'>Analise de descontos por periodo</div></div>"
    +"<div style='display:flex;gap:8px;flex-wrap:wrap'>"+mSel("rm",sm)
    +"<select id='re' onchange='rRel()' style='padding:.4rem .75rem;border:1.5px solid #dde3f0;border-radius:8px;font-size:13px;background:#fff'>"+eOpts+"</select></div></div>"
    +"<div class='ga' style='margin-bottom:1.25rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))'>"
    +sCard("Total Premio",fmtBRL(totP),B,"ti-gift")
    +sCard("Total Perdido",fmtBRL(totD),RED,"ti-trending-down")
    +sCard("Total a Receber",fmtBRL(totR),GRN,"ti-credit-card")+"</div>"
    +(has?
      "<div style='display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-bottom:1rem;align-items:start'>"
      +"<div class='card' style='padding:.875rem'><div style='font-weight:700;font-size:13px;color:"+B+";margin-bottom:.5rem'>Desconto por colaborador - "+ml+"</div><div style='height:160px;position:relative'><canvas id='chbar'></canvas></div></div>"
      +"<div class='card' style='padding:.875rem'><div style='font-weight:700;font-size:13px;color:"+B+";margin-bottom:.5rem'>Composicao</div><div style='height:160px;position:relative'><canvas id='chpie'></canvas></div></div></div>"
      +"<div class='card'><div style='font-weight:700;font-size:14px;color:"+B+";margin-bottom:.875rem'><i class='ti ti-credit-card' style='margin-right:8px;color:"+BL+"'></i>Pagamento Cartao Beneficio - "+ml+"</div>"
      +"<div style='overflow-x:auto'><table><thead><tr style='background:"+B+";color:#fff'>"
      +"<th>Colaborador</th><th>Funcao</th><th>C.Custo</th><th>Faltas</th><th>Atrasos</th><th>5S</th><th>% Desc.</th><th>Premio</th><th>Desconto</th><th>A Receber</th>"
      +"</tr></thead><tbody>"
      +td.map(function(x){
        var cc=x.emp.ccid?DB.cc.find(function(c){return c.id===x.emp.ccid;}):null;
        return "<tr><td style='font-weight:700;color:"+B+"'>"+esc(x.emp.nome)+"</td><td style='color:#555'>"+esc(x.emp.func)+"</td>"
          +"<td>"+(cc?"<span style='background:#e8f0fb;color:"+B+";border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700'>"+esc(cc.cod)+"</span>":"—")+"</td>"
          +"<td style='color:"+RED+";font-weight:700;text-align:center'>"+(x.d?x.d.f:"—")+"</td>"
          +"<td style='color:"+GLD+";font-weight:700;text-align:center'>"+(x.d?x.d.a:"—")+"</td>"
          +"<td style='color:"+PUR+";font-weight:700;text-align:center'>"+(x.d?x.d.s:"—")+"</td>"
          +"<td style='text-align:center'>"+(x.d?"<span style='background:"+(x.d.pct>0?RED+"18":"#e8f8ee")+";color:"+(x.d.pct>0?RED:GRN)+";border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700'>"+x.d.pct+"%</span>":"—")+"</td>"
          +"<td>"+(x.pr?fmtBRL(x.pr.val):"—")+"</td>"
          +"<td style='color:"+RED+";font-weight:700'>"+(x.d?"-"+fmtBRL(x.d.desc):"—")+"</td>"
          +"<td><strong style='color:"+(x.d&&x.d.pct===0?GRN:B)+";font-size:13px'>"+(x.d?fmtBRL(x.d.rec):"—")+"</strong></td></tr>";
      }).join("")
      +"</tbody><tfoot><tr style='background:"+B+"18;font-weight:700'>"
      +"<td colspan='7' style='color:"+B+";font-size:11px;padding:.5rem .75rem'>TOTAIS</td>"
      +"<td style='padding:.5rem .75rem;color:"+B+"'>"+fmtBRL(totP)+"</td>"
      +"<td style='padding:.5rem .75rem;color:"+RED+"'>-"+fmtBRL(totD)+"</td>"
      +"<td style='padding:.5rem .75rem;color:"+GRN+";font-weight:800'>"+fmtBRL(totR)+"</td>"
      +"</tr></tfoot></table></div></div>"
      :"<div class='card' style='text-align:center;padding:3rem;color:#aaa'><i class='ti ti-chart-bar' style='font-size:40px;display:block;margin-bottom:8px'></i>Nenhum dado para o periodo.</div>");
  document.getElementById("rm").addEventListener("change",rRel);
  if(has){
    var fil=td.filter(function(x){return x.d;}),lbs=fil.map(function(x){return x.emp.nome.split(" ")[0];});
    var bF=fil.map(function(x){return x.d.f*getPct("falta",hoje());});
    var bA=fil.map(function(x){return x.d.a*getPct("atraso",hoje());});
    var bS=fil.map(function(x){return x.d.s*getPct("5s",hoje());});
    CH.bar=new Chart(document.getElementById("chbar"),{type:"bar",data:{labels:lbs,datasets:[{label:"Faltas",data:bF,backgroundColor:RED+"bb",borderRadius:3},{label:"Atrasos",data:bA,backgroundColor:GLD+"bb",borderRadius:3},{label:"5S",data:bS,backgroundColor:PUR+"bb",borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top",labels:{boxWidth:10,font:{size:10},padding:6}}},scales:{x:{stacked:true,ticks:{font:{size:10}}},y:{stacked:true,ticks:{callback:function(v){return v+"%";},font:{size:10}}}}}});
    var tf=0,ta=0,ts=0;fil.forEach(function(x){tf+=x.d.f*getPct("falta",hoje());ta+=x.d.a*getPct("atraso",hoje());ts+=x.d.s*getPct("5s",hoje());});
    var pd=[{v:tf,l:"Faltas",c:RED},{v:ta,l:"Atrasos",c:GLD},{v:ts,l:"5S",c:PUR}].filter(function(x){return x.v>0;});
    if(pd.length>0)CH.pie=new Chart(document.getElementById("chpie"),{type:"doughnut",data:{labels:pd.map(function(x){return x.l;}),datasets:[{data:pd.map(function(x){return x.v;}),backgroundColor:pd.map(function(x){return x.c+"cc";}),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10},padding:4}},tooltip:{callbacks:{label:function(ctx){return ctx.label+": "+ctx.raw+"%";}}}}}});
  }
}

</script>
