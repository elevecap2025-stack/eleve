<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyAqsd3CV9dCcqO6W1gL2WYkmsQhrrWOX6M",
  authDomain: "eleve-premios.firebaseapp.com",
  projectId: "eleve-premios",
  storageBucket: "eleve-premios.firebasestorage.app",
  messagingSenderId: "859486758492",
  appId: "1:859486758492:web:ad704bc5edfb87ac9a6899"
};

firebase.initializeApp(firebaseConfig);
var _db = firebase.firestore();

// Cada tabela em um documento separado para evitar limite de tamanho
var COLECOES = ["emp","oc","pr","idx","cc","oc5","motivos","sensos","motdem"];

window._fbLoad = function(){
  var promises = COLECOES.map(function(col){
    return _db.collection("eleve").doc(col).get();
  });
  return Promise.all(promises).then(function(snaps){
    snaps.forEach(function(snap, i){
      var col = COLECOES[i];
      if(snap.exists){
        var d = snap.data();
        window.DB[col] = d.dados || [];
      } else {
        window.DB[col] = [];
      }
    });
    // Inicializa sensos padrao se vazio
    if(!window.DB.sensos || window.DB.sensos.length === 0){
      window.DB.sensos = window.initSensos();
    }
    // Inicializa motivos de desligamento padrao se vazio
    if((!window.DB.motdem || window.DB.motdem.length === 0) && window.initMotDem){
      window.DB.motdem = window.initMotDem();
    }
    console.log("Firebase carregado OK:", {
      emp: window.DB.emp.length,
      oc: window.DB.oc.length,
      cc: window.DB.cc.length
    });
  });
};

window._fbSave = function(){
  var promises = COLECOES.map(function(col){
    return _db.collection("eleve").doc(col).set({
      dados: window.DB[col] || [],
      updated: new Date().toISOString()
    });
  });
  return Promise.all(promises).then(function(){
    console.log("Firebase salvo OK em", new Date().toLocaleTimeString());
  }).catch(function(e){
    console.error("Erro ao salvar no Firebase:", e);
    throw e;
  });
};

// Ping periodico para manter a base ativa (evita pausa por inatividade)
window._pingInterval=null;
window._startPing=function(){
  if(window._pingInterval)return;
  function ping(){
    _db.collection("eleve").doc("_ping").set({ultimo:new Date().toISOString()}).then(function(){
      console.log("Ping Firebase OK -",new Date().toLocaleTimeString("pt-BR"));
    }).catch(function(e){
      console.warn("Ping Firebase falhou:",e.message);
    });
  }
  ping();
  window._pingInterval=setInterval(ping,4*60*1000); // a cada 4 minutos
};

window._fbReady = true;
document.dispatchEvent(new Event("fb-ready"));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Barlow,sans-serif;background:#eef2f6;min-height:100vh;font-size:14px}
input,select,button{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#c3cfdb;border-radius:3px}
.card{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.btnp{background:#0B4E83;color:#fff;border:none;border-radius:8px;padding:.6rem 1rem;font-size:13px;font-weight:700}
.btnp:hover{background:#127DCB}
.btng{background:#eef2f6;color:#555;border:none;border-radius:8px;padding:.6rem 1rem;font-size:13px}
input[type=text],input[type=date],input[type=number],input[type=password],select{
  width:100%;padding:.55rem .75rem;border:1.5px solid #dce3ea;border-radius:8px;
  font-size:13px;outline:none;background:#fff;color:#222}
input:focus,select:focus{border-color:#127DCB;box-shadow:0 0 0 3px rgba(18,125,203,.14)}
.lbl{font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:4px;letter-spacing:.4px;text-transform:uppercase}
.fr{margin-bottom:.875rem}
.page{display:none}.page.active{display:block}
#app{display:flex;min-height:100vh}
#sb{width:220px;background:var(--steel);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
#sb.col{width:56px}
#main{flex:1;padding:1.5rem;overflow-y:auto;min-width:0}
.nb{width:100%;display:flex;align-items:center;gap:10px;padding:.65rem .875rem;
  background:transparent;border:none;border-left:3px solid transparent;
  color:rgba(255,255,255,.6);font-size:13px;font-weight:400;text-align:left;transition:all .15s}
.nb.on{background:rgba(18,125,203,.2);border-left:3px solid var(--blue);color:#fff;font-weight:600}
.nb:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}
.ga{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:.5rem .75rem;text-align:left;font-weight:600;font-size:11px;white-space:nowrap}
td{padding:.5rem .75rem;white-space:nowrap}
tr:nth-child(even) td{background:#f8faff}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999}
.ibedt{background:none;border:none;color:#127DCB;font-size:17px;padding:3px;cursor:pointer}
.ibdel{background:none;border:none;color:#c0392b;font-size:17px;padding:3px;cursor:pointer}
.sync-bar{position:fixed;bottom:1rem;right:1rem;background:#0B4E83;color:#fff;padding:.5rem 1rem;
  border-radius:8px;font-size:12px;font-weight:600;z-index:8888;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.15);transition:all .3s}
.sync-bar.ok{background:#1a7a4a}.sync-bar.err{background:#c0392b}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
#loading-screen{position:fixed;inset:0;background:var(--steel) var(--metal);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:#fff}
/* ===== Identidade Eleve ===== */
:root{
  --ink:#231F20;--steel:#1E2024;--blue:#127DCB;--deep:#0B4E83;--bg:#eef2f6;--line:#dce3ea;
  /* textura de telha trapezoidal (listras sutis) */
  --metal:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 18px,rgba(255,255,255,0) 18px 30px,rgba(0,0,0,.18) 30px 34px,rgba(255,255,255,0) 34px 46px);
}
body{color:var(--ink)}
.btnp{transition:background .15s}
.btnp:disabled{opacity:.5;cursor:not-allowed}
.btng:hover{background:#e2e8ee}
.ibedt{color:var(--blue)}
.ibedt:hover,.ibdel:hover{background:#eef2f6;border-radius:6px}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus-visible,select:focus-visible{outline:none}

/* Loading / Login */
#loading-screen .lg-load{width:230px;height:auto;color:#fff}
#lgw{min-height:100vh;background:var(--steel) var(--metal);align-items:center;justify-content:center;padding:1rem;position:relative}
#lgw::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--deep),var(--blue))}
.lg-card{background:#fff;border-radius:14px;width:360px;max-width:100%;padding:2.25rem 2.25rem 1.75rem;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative;z-index:1}
.lg-brand{text-align:center;margin-bottom:1.75rem}
.lg-login{width:190px;height:auto;color:var(--ink);display:block;margin:0 auto}
.lg-app{margin-top:.9rem;font-size:13px;font-weight:600;color:#6b7580;letter-spacing:.3px}

/* Sidebar */
.sb-hd{padding:.9rem .75rem .9rem .9rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px;min-height:66px}
.sb-icon{width:30px;height:31px;flex-shrink:0}
#sbt{min-width:0}
.sb-word{width:92px;height:16px;color:#fff;display:block}
.sb-app{color:rgba(255,255,255,.45);font-size:10px;margin-top:4px;letter-spacing:.3px}
.sb-tog{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.45);font-size:16px;padding:0;flex-shrink:0}
#sb.col .sb-hd{flex-direction:column;padding:.75rem .25rem;gap:8px}
#sb.col .sb-tog{margin-left:0}
#sb{box-shadow:inset -1px 0 0 rgba(255,255,255,.04)}

/* Cabecalho de pagina */
.pg-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1.25rem}
.h1{font-size:22px;font-weight:800;color:var(--deep)}
.sub{font-size:13px;color:#888}
.btn-ic{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-ic i{font-size:17px}
.btn-red{background:#c0392b}.btn-red:hover{background:#a93226}
.opt{color:#bbb;font-weight:400;text-transform:none}
.hint{font-size:11px;color:#8a94a0;margin-top:5px}
.empty{color:#aaa;font-size:13px;text-align:center;padding:2.5rem 1rem}
.empty i{font-size:34px;display:block;margin-bottom:8px;opacity:.3}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.fr2{grid-template-columns:1fr}}

/* Janelas suspensas (modais) */
.mdl-bg{position:fixed;inset:0;background:rgba(18,22,28,.55);backdrop-filter:blur(2px);display:none;justify-content:center;align-items:flex-start;z-index:9000;padding:5vh 1rem;overflow-y:auto}
.mdl-bg.open{display:flex}
.mdl{background:#fff;border-radius:14px;width:520px;max-width:100%;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:mdIn .18s ease-out;margin:auto 0}
.mdl-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1rem 1.35rem;border-bottom:1px solid #eef1f5}
.mdl-tt{font-size:16px;font-weight:800;color:var(--deep);display:flex;align-items:center;gap:6px}
.mdl-x{background:none;border:none;font-size:22px;color:#9aa3ad;padding:2px;line-height:1}
.mdl-x:hover{color:#555}
.mdl-bd{padding:1.2rem 1.35rem 1.35rem}
.mdl-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:1.1rem;padding-top:1rem;border-top:1px solid #eef1f5}
.mdl-ft .btnp{min-width:150px}
@keyframes mdIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mdl{animation:none}}

/* Segmentado */
.seg{display:inline-flex;gap:2px;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:3px}
.seg-b{border:none;background:transparent;color:#6b7580;font-size:12px;font-weight:700;padding:.38rem .8rem;border-radius:6px;display:inline-flex;align-items:center;gap:6px}
.seg-b.on{background:var(--deep);color:#fff}
.seg-n{font-size:11px;opacity:.7;font-weight:600}
.seg-full{display:flex}.seg-full .seg-b{flex:1;justify-content:center;padding:.5rem}
.seg-full #eat1.on{background:#1a7a4a}.seg-full #eat0.on{background:#6b7580}

/* Colaboradores */
.erow{border-bottom:1px solid var(--bg);padding:.8rem .25rem;display:flex;justify-content:space-between;align-items:center;gap:12px}
.erow:last-child{border-bottom:none}
.erow-main{min-width:0}
.erow-nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.erow-sub{font-size:12px;color:#888}
.erow-meta{font-size:11px;color:#aaa}
.erow.off .erow-nm{color:#7d858d}
.erow-act{display:flex;gap:4px;flex-shrink:0;align-items:center}
.bdg{border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:.2px}
.bdg-ok{background:#e4f4ea;color:#1a7a4a}
.bdg-off{background:#eceff2;color:#6b7580}
.bdg-dem{background:#fbe9e7;color:#c0392b}
.btn-dem{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #f0c7c1;background:#fff;color:#c0392b;border-radius:7px;padding:.28rem .6rem;font-size:12px;font-weight:700;margin-right:4px}
.btn-dem:hover{background:#fbe9e7;border-color:#c0392b}
.btn-dem i{font-size:15px}
.who{background:var(--bg);border-radius:8px;padding:.6rem .8rem;margin-bottom:1rem;display:flex;flex-direction:column;font-size:13px}
.who span{font-size:11px;color:#888}
.warn{background:#fdf3e1;color:#8a5a00;border-radius:8px;padding:.55rem .75rem;font-size:12px;font-weight:600}
.dem-box{background:#fbe9e7;border:1px solid #f3cdc7;border-radius:9px;padding:.7rem .85rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:.5rem}
.dem-box b{color:#c0392b}

/* 5S chips */
.chip{display:inline-flex;align-items:center;gap:3px;background:#e3f0fa;color:var(--deep);border-radius:5px;padding:2px 3px 2px 8px;font-size:11px;font-weight:700}
.chip button{background:none;border:none;color:#6d8aa3;font-size:13px;line-height:1;padding:0 2px;border-radius:3px}
.chip button:hover{color:#c0392b;background:#fff}
.chip.add{background:#e4f4ea;color:#1a7a4a}
@media (max-width:900px){#main{padding:1rem}}
</style>
</head>

function gmk(dt){var d=new Date(dt+"T12:00:00");return d.getFullYear()+"-"+(""+(d.getMonth()+1)).padStart(2,"0");}
function hoje(){return new Date().toISOString().slice(0,10);}
function curMes(){return gmk(hoje());}
function uid(){return Date.now()+""+Math.random().toString(36).slice(2,6);}
function esc(s){return(""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtBRL(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBRLInt(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$"+Math.round(v).toLocaleString("pt-BR");
}
function fmtM(m){var p=m.split("-");return MOS[parseInt(p[1])-1]+"/"+p[0];}
function ini(n){return n.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}
function tEmp(a,d){
  var i=new Date(a+"T12:00:00"),f=d?new Date(d+"T12:00:00"):new Date();
  var anos=(f-i)/(1000*60*60*24*365.25);
  if(anos<1){var m=Math.floor(anos*12);return m<=0?"< 1 mes":m+" mes"+(m>1?"es":"");}
  return anos.toFixed(1)+" anos";
}
function getPct(tipo,data){
  var at=DB.idx.filter(function(x){return x.tipo===tipo&&x.ini<=data&&(!x.fim||x.fim>=data);});
  if(at.length>0)return at[at.length-1].pct;
  return {falta:15,atraso:5,"5s":10}[tipo]||0;
}
function calcDesc(eid,mes,val){
  var ocs=DB.oc.filter(function(x){return x.eid===eid&&gmk(x.data)===mes;});
  var f=ocs.filter(function(x){return x.tipo==="falta";}).length;
  var a=ocs.filter(function(x){return x.tipo==="atraso";}).length;
  var s=ocs.filter(function(x){return x.tipo==="5s";}).length;
  var pct=0;ocs.forEach(function(x){pct+=getPct(x.tipo,x.data);});
  pct=Math.min(100,pct);
  return{f:f,a:a,s:s,pct:pct,desc:(pct/100)*val,rec:val*(1-pct/100)};
}

// ═══ CORES DEGRADE PARA GRAFICOS ═══
function shade(hex,p){
  var h=hex.replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");
  var n=parseInt(h,16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.round(p<0?c*(1+p):c+(255-c)*p);}
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
// Degrade vertical (barras): mais claro na base, cor cheia no topo
function vGrad(c){
  return function(ctx){
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(0,a.bottom,0,a.top);
    g.addColorStop(0,shade(c,.55));g.addColorStop(.6,shade(c,.05));g.addColorStop(1,shade(c,-.18));
    return g;
  };
}
// Degrade por fatia (rosca/pizza)
function segGrad(colors){
  return function(ctx){
    var c=colors[ctx.dataIndex%colors.length]||"#888";
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(a.left,a.top,a.right,a.bottom);
    g.addColorStop(0,shade(c,.32));g.addColorStop(1,shade(c,-.22));
    return g;
  };
}

function rDash(){
  killCH();
  var selAno=document.getElementById("dash-ano")&&document.getElementById("dash-ano").value||String(new Date().getFullYear());
  var selMes=document.getElementById("dash-mes")&&document.getElementById("dash-mes").value||curMes();
  var modo=document.getElementById("dash-modo")&&document.getElementById("dash-modo").value||"mes"; // "mes" ou "ano"

  // Build year options
  var anos={};DB.oc.forEach(function(o){anos[gmk(o.data).split("-")[0]]=1;});DB.pr.forEach(function(p){});
  var anoAtual=String(new Date().getFullYear());anos[anoAtual]=1;
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  // Testa se uma data cai dentro do periodo selecionado (mes especifico ou o ano inteiro)
  function noPeriodo(dataStr){
    return modo==="ano"?gmk(dataStr).split("-")[0]===selAno:gmk(dataStr)===selMes;
  }

  // Build annual data - usa apenas os meses que realmente possuem lancamentos (ocorrencias) no ano,

  // Annual paid chart (degrade + rotulos maiores)

        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+": "+ctx.raw;}}},

// ═══════════════════════════════════════
// RELATORIO PDF DO DASHBOARD (2 folhas A4)
// ═══════════════════════════════════════
function gerarRelatorioPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._dashStats;
  if(!st){alert("Abra o Dashboard antes de gerar o relatorio.");return;}
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var pageW=297,pageH=210,mg=13,cw=pageW-mg*2;
  var rgbB=[11,78,131],rgbBL=[18,125,203],rgbINK=[30,32,36],rgbRED=[192,57,43],rgbGRN=[26,122,74],rgbGLD=[230,168,23],rgbPUR=[123,63,160],rgbLine=[228,233,244];
  var BANDH=25,PXSCALE=7;

  function rgba(rgb,a){return "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+(a===undefined?1:a)+")";}

  // ---- Elementos base reutilizaveis ----
  function panel(x,y,w,h){
    doc.setFillColor(255,255,255);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.35);
    doc.roundedRect(x,y,w,h,2,2,"FD");
  }
  function header(titulo){
    doc.setFillColor(rgbINK[0],rgbINK[1],rgbINK[2]);
    doc.rect(0,0,pageW,BANDH,"F");
    doc.setFillColor(rgbBL[0],rgbBL[1],rgbBL[2]);
    doc.rect(0,BANDH,pageW,1.2,"F");
    if(window._logoPNG){
      doc.addImage(window._logoPNG,"PNG",mg,4.2,59.8,13);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);
      doc.setTextColor(200,208,218);
      doc.text("Gestao de Premios",mg+60.5+3,15.2);
    }else{
      doc.setFont("helvetica","bold");doc.setFontSize(15);
      doc.setTextColor(255,255,255);
      doc.text("ELEVE",mg,11);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);
      doc.setTextColor(200,208,218);
      doc.text("Telhas e Perfis Metalicos  -  Gestao de Premios",mg,16.5);
    }
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setTextColor(255,255,255);
    doc.text(titulo,pageW-mg,10.5,{align:"right"});
    var agora=new Date();
    var dataStr=agora.toLocaleDateString("pt-BR")+" as "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    doc.setFont("helvetica","normal");doc.setFontSize(8);
    doc.setTextColor(215,224,242);
    doc.text("Periodo: "+st.ml,pageW-mg,16,{align:"right"});
    doc.setFontSize(7);doc.setTextColor(180,195,225);
    doc.text("Gerado em "+dataStr,pageW-mg,20.5,{align:"right"});
    return BANDH+9;
  }
  function footer(pagNum){
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.3);
    doc.line(mg,pageH-10,pageW-mg,pageH-10);
    doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(165,165,165);
    doc.text("Eleve - Sistema de Gestao de Premios",mg,pageH-6);
    doc.text("Documento gerado automaticamente pelo sistema",pageW/2,pageH-6,{align:"center"});
    doc.text("Pagina "+pagNum+"/2",pageW-mg,pageH-6,{align:"right"});
  }
  function sectionLabel(txt,x,y,rgb){
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y-3.2,2.2,2.2,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(10.5);
    doc.setTextColor(50,50,50);
    doc.text(txt,x+4.5,y);
  }
  function statCard(x,y,w,h,lb,val,rgb){
    panel(x,y,w,h);
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y,w,1.1,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(6.8);
    doc.setTextColor(130,130,130);
    doc.text(String(lb).toUpperCase(),x+3,y+7.5);
    doc.setFont("helvetica","bold");doc.setFontSize(12.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(String(val),x+3,y+15.5);
  }
  // Painel que recebe uma imagem de grafico JA renderizada no tamanho exato da area util (sem sobra/distorcao)
  function chartPanel(imgDataUrl,x,y,w,h,titulo,rgb){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(titulo,x+4,y+6.5);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.25);
    doc.line(x+4,y+8.5,x+w-4,y+8.5);
    var areaX=x+4,areaY=y+11,areaW=w-8,areaH=h-14;
    if(!imgDataUrl){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem dados no periodo",x+w/2,y+h/2,{align:"center"});
      return;
    }
    doc.addImage(imgDataUrl,"PNG",areaX,areaY,areaW,areaH);
  }
  function rankPanel(x,y,w,h,title,items,rgb,colLabel){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(title,x+4,y+6.5);
    var tx=x+4,tw=w-8,rowH=5.6,yy=y+9.5;
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(tx,yy,tw,rowH,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(7.3);doc.setTextColor(255,255,255);
    doc.text("#",tx+2.5,yy+3.8);
    doc.text("Colaborador",tx+9,yy+3.8);
    doc.text(colLabel,tx+tw-2.5,yy+3.8,{align:"right"});
    yy+=rowH;
    var maxRows=Math.max(1,Math.floor((h-(yy-y)-3)/rowH));
    var top=items.slice(0,Math.min(10,maxRows));
    if(top.length===0){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem ocorrencias no periodo",tx+2.5,yy+4);
      return;
    }
    top.forEach(function(it,i){
      if(i%2===1){doc.setFillColor(248,250,255);doc.rect(tx,yy,tw,rowH,"F");}
      doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(70,70,70);
      doc.text(String(i+1),tx+2.5,yy+3.8);
      var nomeShort=it.nome.length>36?it.nome.slice(0,34)+"...":it.nome;
      doc.text(nomeShort,tx+9,yy+3.8);
      doc.setFont("helvetica","bold");doc.setTextColor(rgb[0],rgb[1],rgb[2]);
      doc.text(String(it.count),tx+tw-2.5,yy+3.8,{align:"right"});
      yy+=rowH;
    });
  }

  // ---- Geracao de graficos em canvas temporario (fora da tela), no tamanho EXATO da area do painel ----
  // Isso garante que a imagem preencha o quadrado inteiro, sem sobra branca nem distorcao.
  function tempCanvas(pxW,pxH){
    var cv=document.createElement("canvas");
    cv.width=pxW;cv.height=pxH;
    cv.style.position="fixed";cv.style.left="-99999px";cv.style.top="0";
    document.body.appendChild(cv);
    return cv;
  }
  var dlP=(typeof ChartDataLabels!=="undefined")?[ChartDataLabels]:[];
  function renderOffscreen(cfg,areaW,areaH){
    var pxW=Math.max(50,Math.round(areaW*PXSCALE)),pxH=Math.max(50,Math.round(areaH*PXSCALE));
    var cv=tempCanvas(pxW,pxH);
    var ch=new Chart(cv,cfg);
    var img=ch.toBase64Image();
    ch.destroy();cv.remove();
    return img;
  }
  function doughnutImg(bd,areaW,areaH){
    if(!bd||!bd.labels||bd.labels.length===0)return null;
    return renderOffscreen({type:"doughnut",plugins:dlP,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:bd.colors,borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:false,animation:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:16,font:{size:15},padding:10}},
          datalabels:{color:"#fff",font:{size:15,weight:700},formatter:function(v){return v;}}}}
    },areaW,areaH);
  }
  function barImg(labels,datasets,areaW,areaH,money){
    if(!labels||labels.length===0)return null;
    return renderOffscreen({type:"bar",plugins:dlP,
      data:{labels:labels,datasets:datasets},
      options:{responsive:false,animation:false,
        plugins:{legend:{display:datasets.length>1,position:"top",labels:{boxWidth:14,font:{size:14},padding:8}},
          datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",
            color:function(ctx){return ctx.dataset.borderColor;},font:{size:12,weight:700},
            formatter:function(v){return money?fmtBRLInt(v):v;}}},
        scales:{y:{beginAtZero:true,ticks:{font:{size:13},precision:money?2:0,callback:money?function(v){return fmtBRLInt(v);}:undefined},grid:{color:"#eef1f8"}},
                x:{ticks:{font:{size:13}},grid:{display:false}}}}
    },areaW,areaH);
  }

  // ===== PAGINA 1 - VISAO GERAL =====
  var tituloModo=st.modo==="ano"?"Relatorio Anual (Acumulado)":"Relatorio Mensal";
  var y=header(tituloModo);

  sectionLabel("Indicadores - "+st.ml,mg,y,rgbB);
  y+=4;
  var statsArr=[
    {lb:"Colaboradores ativos",val:String(DB.emp.filter(isAtivo).length),rgb:rgbB},
    {lb:"100% Premio "+st.sufixo,val:String(st.ok),rgb:rgbGRN},
    {lb:"Total Pago "+st.sufixo,val:fmtBRL(st.tp),rgb:rgbBL},
    {lb:"Total Perdido "+st.sufixo,val:fmtBRL(st.tl),rgb:rgbRED},
    {lb:"Faltas",val:String(st.tf),rgb:rgbRED},
    {lb:"Atrasos",val:String(st.ta),rgb:rgbGLD},
    {lb:"Infracoes 5S",val:String(st.ts),rgb:rgbPUR}
  ];
  var gap=3.5,cardW=(cw-6*gap)/7,cardH=20;
  statsArr.forEach(function(s,i){
    statCard(mg+i*(cardW+gap),y,cardW,cardH,s.lb,s.val,s.rgb);
  });
  y+=cardH+9;

  sectionLabel("Evolucao Anual - "+st.selAno,mg,y,rgbB);
  y+=4;
  var colW=(cw-2*gap)/3,chartH=Math.min(105,pageH-10-y-4);
  var areaW1=colW-8,areaH1=chartH-14;
  var imgPago=barImg(st.lblAnual,[{label:"Total Pago",data:st.aPago,backgroundColor:rgba(rgbGRN,.82),borderColor:rgba(rgbGRN,1),borderRadius:4}],areaW1,areaH1,true);
  var imgPerd=barImg(st.lblAnual,[{label:"Total Perdido",data:st.aPerd,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4}],areaW1,areaH1,true);
  var imgFA=barImg(st.lblAnual,[
    {label:"Faltas",data:st.aFaltas,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4},
    {label:"Atrasos",data:st.aAtrasos,backgroundColor:rgba(rgbGLD,.82),borderColor:rgba(rgbGLD,1),borderRadius:4}
  ],areaW1,areaH1,false);
  chartPanel(imgPago,mg,y,colW,chartH,"Total Pago por Mes",rgbGRN);
  chartPanel(imgPerd,mg+colW+gap,y,colW,chartH,"Total Perdido por Mes",rgbRED);
  chartPanel(imgFA,mg+2*(colW+gap),y,colW,chartH,"Faltas e Atrasos por Mes",rgbB);

  footer(1);

  // ===== PAGINA 2 - MOTIVOS E RANKINGS =====
  doc.addPage();
  y=header(tituloModo);

  sectionLabel("Motivos das Ocorrencias - "+st.ml,mg,y,rgbB);
  y+=4;
  var motH=72;
  var areaW2=colW-8,areaH2=motH-14;
  var imgFmot=doughnutImg(st.motFaltas,areaW2,areaH2);
  var imgAmot=doughnutImg(st.motAtrasos,areaW2,areaH2);
  var imgSmot=doughnutImg(st.sensos5S,areaW2,areaH2);
  chartPanel(imgFmot,mg,y,colW,motH,"Motivos de Faltas",rgbRED);
  chartPanel(imgAmot,mg+colW+gap,y,colW,motH,"Motivos de Atrasos",rgbGLD);
  chartPanel(imgSmot,mg+2*(colW+gap),y,colW,motH,"5S por Senso",rgbPUR);
  y+=motH+9;

  sectionLabel("Rankings - "+st.ml,mg,y,rgbB);
  y+=4;
  var rankW=(cw-gap)/2,rankH=Math.min(72,pageH-10-y-4);
  rankPanel(mg,y,rankW,rankH,"Ranking de Faltas",st.rankF,rgbRED,"Faltas");
  rankPanel(mg+rankW+gap,y,rankW,rankH,"Ranking de Atrasos",st.rankA,rgbGLD,"Atrasos");

  footer(2);

  doc.save("relatorio-dashboard-"+(st.modo==="ano"?st.selAno:st.selMes)+".pdf");
}

function rCCList(list){
  if(list.length===0)return "<div class='empty'><i class='ti ti-building'></i>"+(DB.cc.length?"Nenhum centro encontrado.":"Nenhum centro cadastrado. Clique em Novo centro de custo.")+"</div>";
  return list.map(function(cc){
    var cnt=DB.emp.filter(function(e){return e.ccid===cc.id&&isAtivo(e);}).length;
    return "<div class='erow'>"
      +"<div class='erow-main'>"
      +"<div style='display:flex;align-items:center;gap:8px;margin-bottom:2px'>"
      +"<span style='background:#e3f0fa;color:"+B+";border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;flex-shrink:0'>"+esc(cc.cod)+"</span>"
      +"<span style='font-weight:700;font-size:14px'>"+esc(cc.desc)+"</span></div>"
      +"<div class='erow-sub'>"+(cc.resp?"<i class='ti ti-user' style='font-size:11px'></i> "+esc(cc.resp)+" &middot; ":"")
      +"<span style='color:"+BL+";font-weight:600'>"+cnt+" colaborador"+(cnt!==1?"es":"")+" ativo"+(cnt!==1?"s":"")+"</span></div>"
      +(cc.obs?"<div class='erow-meta'>"+esc(cc.obs)+"</div>":"")+"</div>"

}
function filtCC(){
  var el=document.getElementById("cclist");if(!el)return;
  var q=gv("ccbsc").toLowerCase();
  el.innerHTML=rCCList(DB.cc.filter(function(cc){
    return !q||cc.cod.toLowerCase().includes(q)||cc.desc.toLowerCase().includes(q)||(cc.resp||"").toLowerCase().includes(q);
  }).sort(function(a,b){return a.cod.localeCompare(b.cod);}));
}
function novoCC(){canCC();openMd("md-cc");}
function savCC(){
  var id=gv("cceid");
  var cod=gv("cccod").trim(),desc=gv("ccdesc").trim(),resp=gv("ccresp").trim(),obs=gv("ccobs").trim();
  if(!cod||!desc){alert("Preencha codigo e descricao.");return;}
  if(DB.cc.find(function(x){return x.cod.toLowerCase()===cod.toLowerCase()&&x.id!==id;})){alert("Codigo ja existe.");return;}
  var obj={id:id||uid(),cod:cod,desc:desc,resp:resp,obs:obs};
  if(id){DB.cc=DB.cc.map(function(x){return x.id===id?obj:x;});}else{DB.cc.push(obj);}
  dbSave();rCC();
}
function edtCC(id){
  var cc=DB.cc.find(function(x){return x.id===id;});if(!cc)return;
  document.getElementById("cceid").value=id;
  document.getElementById("cccod").value=cc.cod;
  document.getElementById("ccdesc").value=cc.desc;
  document.getElementById("ccresp").value=cc.resp||"";
  document.getElementById("ccobs").value=cc.obs||"";
  document.getElementById("ccft").textContent="Editar centro de custo";
  document.getElementById("ccsav").textContent="Salvar alteracoes";
  openMd("md-cc");
}
function canCC(){
  ["cceid","cccod","ccdesc","ccresp","ccobs"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  var t=document.getElementById("ccft");if(t)t.textContent="Novo centro de custo";
  var b=document.getElementById("ccsav");if(b)b.textContent="Cadastrar";
  closeMd("md-cc");
}
function delCC(id){
  var cnt=DB.emp.filter(function(e){return e.ccid===id;}).length;
  var msg=cnt>0?"Centro possui "+cnt+" colaborador"+(cnt!==1?"es":"")+". Remover mesmo assim?":"Remover este centro?";
  if(!confirm(msg))return;
  DB.cc=DB.cc.filter(function(x){return x.id!==id;});
  DB.emp=DB.emp.map(function(e){return e.ccid===id?Object.assign({},e,{ccid:""}):e;});
  dbSave();rCC();
}

function empListaFiltrada(q){
  q=(q||"").toLowerCase();
  return DB.emp.filter(function(e){
    var a=isAtivo(e);
    if(empFiltro==="ativos"&&!a)return false;
    if(empFiltro==="inativos"&&a)return false;
    return !q||e.nome.toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q);
  }).sort(function(a,b){return a.nome.localeCompare(b.nome);});
}
function setEmpFiltro(k){
  empFiltro=k;

  filtEmp();

      +"<div class='erow-meta'>Admissao: "+fmtD(e.adm)+" &middot; <strong style='color:"+B+"'>"+tEmp(e.adm,e.dem)+"</strong>"
      +(e.dem?"<span style='color:"+RED+"'> &middot; Demissao: "+fmtD(e.dem)+" &middot; "+esc(motDemNome(e.motdem))+"</span>":"")

}

function savEmp(){
  var id=gv("eid");
  var nome=gv("enome").trim(),func=gv("efunc").trim(),ccid=gv("ecc"),adm=gv("eadm");
  var ativo=gv("eativo")==="1";
  if(!nome||!func||!adm){alert("Preencha nome, funcao e admissao.");return;}
  var old=id?DB.emp.find(function(e){return e.id===id;}):null;
  if(old&&old.dem&&ativo&&!confirm(nome+" esta demitido. Marcar como ativo cancela a demissao. Continuar?"))return;
  var obj=Object.assign({},old||{dem:""},{id:id||uid(),nome:nome,func:func,ccid:ccid,adm:adm,ativo:ativo});
  if(ativo){obj.dem="";delete obj.motdem;delete obj.obsdem;delete obj.inat;}
  else if(!obj.dem&&!obj.inat){obj.inat=hoje();}
  if(obj.dem&&adm>obj.dem){alert("A admissao nao pode ser posterior a demissao ("+fmtD(obj.dem)+").");return;}
  if(id){DB.emp=DB.emp.map(function(e){return e.id===id?obj:e;});}else{DB.emp.push(obj);}
  dbSave();rEmp();
}

function addMotDem(){
  var nm=gv("dmnovonm").trim();

  var ex=DB.motdem.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();});

function confDem(){
  var id=gv("dmid"),data=gv("dmdata"),mot=gv("dmmot"),obs=gv("dmobs").trim();
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;

  if(e.adm&&data<e.adm){alert("A demissao nao pode ser anterior a admissao ("+fmtD(e.adm)+").");return;}
  if(!mot){alert("Selecione o motivo da saida (ou cadastre um novo).");return;}

    if(x.id!==id)return x;
    var n=Object.assign({},x,{dem:data,motdem:mot,obsdem:obs,ativo:false});delete n.inat;return n;
  });

function savMotDemPg(){
  var nm=gv("mdnome").trim();if(!nm){alert("Informe o nome do motivo.");return;}
  if(DB.motdem.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();})){alert("Esse motivo ja existe.");return;}
  DB.motdem.push({id:uid(),nome:nm});dbSave();rMotivos();
}
function delMotDem(id){
  var cnt=DB.emp.filter(function(e){return e.motdem===id;}).length;
  if(!confirm(cnt?"Este motivo esta em "+cnt+" demissao(oes). Remover mesmo assim? (elas ficarao como Sem motivo)":"Remover este motivo?"))return;
  DB.motdem=DB.motdem.filter(function(m){return m.id!==id;});dbSave();rMotivos();
}
var motTipoSel="falta";
function setMotTipo(t){
  motTipoSel=t;
  var el=document.getElementById("mot-tipo-sel");if(el)el.value=t;
  var bf=document.getElementById("motbf"),ba=document.getElementById("motba");
  if(bf){if(t==="falta"){bf.style.borderColor=RED;bf.style.background=RED+"18";bf.style.color=RED;}else{bf.style.borderColor="#dce3ea";bf.style.background="#fff";bf.style.color="#777";}}
  if(ba){if(t==="atraso"){ba.style.borderColor=GLD;ba.style.background=GLD+"18";ba.style.color=GLD;}else{ba.style.borderColor="#dce3ea";ba.style.background="#fff";ba.style.color="#777";}}
  // Update motivo list select
  var sel=document.getElementById("mot-tipo");if(sel)sel.value=t;
}
function savMot(){
  var id=document.getElementById("mot-id").value;
  var tipo=document.getElementById("mot-tipo-sel").value;
  var nome=document.getElementById("mot-nome").value.trim();
  var desc=document.getElementById("mot-desc").value.trim();
  if(!nome){alert("Informe o nome do motivo.");return;}
  var obj={id:id||uid(),tipo:tipo,nome:nome,desc:desc};
  if(id){DB.motivos=DB.motivos.map(function(x){return x.id===id?obj:x;});}else{DB.motivos.push(obj);}
  dbSave();canMot();rMotivos();
}
function edtMot(id){
  var m=DB.motivos.find(function(x){return x.id===id;});if(!m)return;
  document.getElementById("mot-id").value=id;
  document.getElementById("mot-nome").value=m.nome;
  document.getElementById("mot-desc").value=m.desc||"";
  document.getElementById("mot-ft").textContent="Editar motivo";
  document.getElementById("mot-cb").style.display="";
  document.querySelector("#p-motivos .btnp").textContent="Salvar alteracoes";
  setMotTipo(m.tipo);
}
function canMot(){
  ["mot-id","mot-nome","mot-desc"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("mot-ft").textContent="Novo motivo";
  document.getElementById("mot-cb").style.display="none";
  var btn=document.querySelector("#p-motivos .btnp");if(btn)btn.textContent="Cadastrar";
}
function delMot(id){
  if(!confirm("Remover este motivo?"))return;
  DB.motivos=DB.motivos.filter(function(x){return x.id!==id;});
  dbSave();rMotivos();
}
function savSen(){
  var id=document.getElementById("sen-id").value;

  var desc=document.getElementById("sen-desc").value.trim();

function s5Base(){
  var modo=gv("s5modo")||s5Modo;
  var ccid=gv("s5cc");
  var ativos=DB.emp.filter(isAtivo);
  if(modo==="geral")return ativos.map(function(e){return e.id;});
  return ccid?ativos.filter(function(e){return e.ccid===ccid;}).map(function(e){return e.id;}):[];
}
function s5Reset(){s5Sel=s5Base();upd5SPreview();}
function s5Rem(id){s5Sel=s5Sel.filter(function(x){return x!==id;});upd5SPreview();}
function s5Add(id){if(id&&s5Sel.indexOf(id)<0)s5Sel.push(id);upd5SPreview();}
function setModo5S(m){
  s5Modo=m;
  var el=document.getElementById("s5modo");if(el)el.value=m;
  var bgeral=document.getElementById("s5mgeral"),bcc=document.getElementById("s5mcc");
  var ccrow=document.getElementById("s5ccrow");
  if(m==="geral"){
    if(bgeral){bgeral.style.borderColor=RED;bgeral.style.background=RED+"18";bgeral.style.color=RED;}
    if(bcc){bcc.style.borderColor="#dce3ea";bcc.style.background="#fff";bcc.style.color="#777";}
    if(ccrow)ccrow.style.display="none";
  }else{
    if(bcc){bcc.style.borderColor=BL;bcc.style.background=BL+"18";bcc.style.color=BL;}
    if(bgeral){bgeral.style.borderColor="#dce3ea";bgeral.style.background="#fff";bgeral.style.color="#777";}
    if(ccrow)ccrow.style.display="";
  }
  s5Reset();
}
function upd5SPreview(){
  var pl=document.getElementById("s5prevlist");if(!pl)return;
  var modo=gv("s5modo")||"geral",ccid=gv("s5cc");
  var base=s5Base();
  var emps=s5Sel.map(function(id){return DB.emp.find(function(e){return e.id===id;});}).filter(Boolean)
    .sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var alterado=base.length!==s5Sel.length||base.some(function(id){return s5Sel.indexOf(id)<0;});
  var rb=document.getElementById("s5restore");if(rb)rb.style.display=alterado?"":"none";
  if(emps.length===0){
    pl.innerHTML="<span style='color:#aaa'>Nenhum colaborador"+(modo==="cc"&&!ccid?" (selecione um centro ou adicione abaixo)":"")+"</span>";
  }else{
    pl.innerHTML="<strong style='color:"+B+"'>"+emps.length+"</strong> colaborador"+(emps.length!==1?"es":"")+" afetado"+(emps.length!==1?"s":"")
      +" <span style='color:#9aa3ad'>&middot; clique no x para excluir</span>"
      +"<div style='display:flex;flex-wrap:wrap;gap:4px;margin-top:6px'>"
      +emps.map(function(e){
        var extra=base.indexOf(e.id)<0;
        return "<span class='chip"+(extra?" add":"")+"' title='"+esc(e.nome)+(extra?" (adicionado manualmente)":"")+"'>"+esc(nome1(e))
          +"<button type='button' onclick=\"s5Rem('"+e.id+"')\" aria-label='Excluir "+esc(e.nome)+"'><i class='ti ti-x'></i></button></span>";
      }).join("")
      +"</div>";
  }
  var add=document.getElementById("s5add");
  if(add){
    var fora=DB.emp.filter(function(e){return isAtivo(e)&&s5Sel.indexOf(e.id)<0;}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
    add.innerHTML="<option value=''>+ Adicionar colaborador"+(fora.length?" ("+fora.length+" disponive"+(fora.length!==1?"is":"l")+")":"")+"</option>"
      +fora.map(function(e){var c=DB.cc.find(function(x){return x.id===e.ccid;});return "<option value='"+e.id+"'>"+esc(e.nome)+(c?" - "+esc(c.cod):"")+"</option>";}).join("");
    add.disabled=fora.length===0;
  }
}
function sav5S(){
  var id=gv("s5id");
  var modo=gv("s5modo");
  var ccid=gv("s5cc");
  var data=gv("s5data");
  var obs=gv("s5obs").trim();
  if(!data){alert("Informe a data.");return;}
  if(modo==="cc"&&!ccid){alert("Selecione o centro de custo.");return;}
  var emps=s5Sel.map(function(x){return DB.emp.find(function(e){return e.id===x;});}).filter(Boolean);
  if(emps.length===0){alert("Nenhum colaborador afetado. Adicione ao menos um colaborador.");return;}
  var s5senso=gv("s5senso");
  var obj={id:id||uid(),modo:modo,ccid:modo==="cc"?ccid:"",data:data,obs:obs,senso_id:s5senso,eids:emps.map(function(e){return e.id;})};
  if(id){
    DB.oc5=DB.oc5.map(function(x){return x.id===id?obj:x;});
    DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  }else{
    DB.oc5.push(obj);
  }
  emps.forEach(function(e){
    DB.oc.push({id:uid(),eid:e.id,tipo:"5s",data:data,obs:obs,s5ref:obj.id,senso_id:s5senso});
  });
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}
function edt5S(id){
  var o=DB.oc5.find(function(x){return x.id===id;});if(!o)return;
  can5S();
  document.getElementById("s5id").value=id;
  document.getElementById("s5data").value=o.data;
  document.getElementById("s5obs").value=o.obs||"";
  var ss=document.getElementById("s5senso");if(ss)ss.value=o.senso_id||"";
  document.getElementById("s5ft").textContent="Editar infracao 5S";
  document.getElementById("s5sav").textContent="Salvar alteracoes";
  if(o.modo==="cc"){var cc=document.getElementById("s5cc");if(cc)cc.value=o.ccid||"";}
  setModo5S(o.modo);
  // lista salva (inclui ajustes manuais); registros antigos: colaboradores que receberam o desconto
  s5Sel=s5Afetados(o).map(function(e){return e.id;});
  upd5SPreview();
  openMd("md-5s");
}
function can5S(){
  var i=document.getElementById("s5id");if(!i)return;
  i.value="";
  document.getElementById("s5data").value=hoje();
  document.getElementById("s5obs").value="";
  var ss=document.getElementById("s5senso");if(ss)ss.value="";
  var cc=document.getElementById("s5cc");if(cc)cc.value="";
  document.getElementById("s5ft").textContent="Nova infracao 5S";
  document.getElementById("s5sav").textContent="Lancar Infracao 5S";
  setModo5S("geral");
  closeMd("md-5s");
}
function del5S(id){
  if(!confirm("Remover esta infracao 5S e todos os descontos vinculados?"))return;
  DB.oc5=DB.oc5.filter(function(x){return x.id!==id;});
  DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}

function aplTodos(){

  if(!confirm("Aplicar "+fmtBRL(v)+" para todos os "+ativos.length+" colaboradores ativos?"))return;
  ativos.forEach(function(e){DB.pr=DB.pr.filter(function(p){return p.eid!==e.id;});DB.pr.push({eid:e.id,val:v});});
  dbSave();rPrem();var inp=document.getElementById("ptodos");if(inp)inp.value=v;

var MPAL=["#127DCB","#c0392b","#e6a817","#7b3fa0","#1a7a4a","#0B4E83","#e67e22","#5d6d7e","#16a085","#d35400"];
function rMon(){
  killCH();
  var anoAtual=String(new Date().getFullYear());
  var selAno=gv("mon-ano")||anoAtual;
  var selMes=gv("mon-mes")||curMes();
  selMes=selAno+"-"+selMes.split("-")[1];

  var anos={};anos[anoAtual]=1;
  DB.emp.forEach(function(e){if(e.adm)anos[e.adm.slice(0,4)]=1;if(e.dem)anos[e.dem.slice(0,4)]=1;});
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  function fimMes(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return p[0]+"-"+p[1]+"-"+String(d.getDate()).padStart(2,"0");}
  function prevMes(m){var p=m.split("-").map(Number);var d=new Date(p[0],p[1]-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  function quadro(m){var f=fimMes(m);return DB.emp.filter(function(e){return e.adm&&e.adm<=f&&(!e.dem||e.dem>f);}).length;}
  function contr(m){return DB.emp.filter(function(e){return e.adm&&e.adm.slice(0,7)===m;});}
  function demit(m){return DB.emp.filter(function(e){return e.dem&&e.dem.slice(0,7)===m;});}

  var ultimo=selAno===anoAtual?new Date().getMonth()+1:12;
  if(selAno>anoAtual)ultimo=12;
  var meses=[];for(var i=1;i<=ultimo;i++)meses.push(selAno+"-"+String(i).padStart(2,"0"));
  var lbl=meses.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aQuadro=meses.map(quadro),aContr=meses.map(function(m){return contr(m).length;}),aDem=meses.map(function(m){return demit(m).length;});

  var ativos=DB.emp.filter(isAtivo).length,inativos=DB.emp.length-ativos;
  var qMes=quadro(selMes),qIni=quadro(prevMes(selMes));
  var cMes=contr(selMes),dMes=demit(selMes);
  var media=(qIni+qMes)/2;
  var turn=media>0?((cMes.length+dMes.length)/2)/media*100:0;
  var mlb=fmtM(selMes);
  var dAno=DB.emp.filter(function(e){return e.dem&&e.dem.slice(0,4)===selAno;});
  var cAno=DB.emp.filter(function(e){return e.adm&&e.adm.slice(0,4)===selAno;});

  function motBD(list){
    var map={};list.forEach(function(e){var n=motDemNome(e.motdem);map[n]=(map[n]||0)+1;});
    var lbs=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
    return{labels:lbs,values:lbs.map(function(k){return map[k];}),colors:lbs.map(function(k){var i=DB.motdem.findIndex(function(m){return m.nome===k;});return i<0?"#9aa3ad":MPAL[i%MPAL.length];})};
  }
  var bdMes=motBD(dMes),bdAno=motBD(dAno);

  // ABSENTEISMO = faltas / (colaboradores x dias uteis) x 100  (dias uteis = seg a sex; mes atual conta ate hoje)
  function diasUteis(m){
    var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
    for(var d=1;d<=last;d++){
      var ds=m+"-"+String(d).padStart(2,"0");
      if(ds>hj)break;
      var w=new Date(p[0],p[1]-1,d).getDay();
      if(w!==0&&w!==6)n++;
    }
    return n;
  }
  function absent(m,ccid){
    var f=fimMes(m),ini=m+"-01";
    var emps=DB.emp.filter(function(e){return e.adm&&e.adm<=f&&(!e.dem||e.dem>=ini)&&(ccid===undefined||(e.ccid||"")===ccid);});
    var ids={};emps.forEach(function(e){ids[e.id]=1;});
    var faltas=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&(ccid===undefined||ids[o.eid]);}).length;
    var atrasos=DB.oc.filter(function(o){return o.tipo==="atraso"&&gmk(o.data)===m&&(ccid===undefined||ids[o.eid]);}).length;
    var du=diasUteis(m),base=emps.length*du;
    return{pct:base>0?faltas/base*100:0,faltas:faltas,atrasos:atrasos,du:du,hc:emps.length};
  }
  var aAbs=meses.map(function(m){return absent(m);});
  var absMes=absent(selMes);
  var absAnoF=0,absAnoB=0;
  meses.forEach(function(m,i){absAnoF+=aAbs[i].faltas;absAnoB+=aAbs[i].hc*aAbs[i].du;});
  var absAno=absAnoB>0?absAnoF/absAnoB*100:0;
  var duAno=aAbs.reduce(function(a,r){return a+r.du;},0);
  // acumulado do ano mes a mes (faltas somadas / base somada)
  var accF=0,accB=0,aAbsAcc=aAbs.map(function(r){accF+=r.faltas;accB+=r.hc*r.du;return accB>0?accF/accB*100:0;});
  // absenteismo do ano por centro de custo
  function absentAno(ccid){
    var f=0,b=0,hc={};
    meses.forEach(function(m){var r=absent(m,ccid);f+=r.faltas;b+=r.hc*r.du;});
    return{pct:b>0?f/b*100:0,faltas:f};
  }
  // absenteismo do ano por colaborador (dias uteis dos meses em que estava na empresa)
  var rankAbs=DB.emp.map(function(e){
    var du=0,f=0;
    meses.forEach(function(m){
      var fim=fimMes(m),ini=m+"-01";
      if(!(e.adm&&e.adm<=fim&&(!e.dem||e.dem>=ini)))return;
      du+=diasUteis(m);
      f+=DB.oc.filter(function(o){return o.eid===e.id&&o.tipo==="falta"&&gmk(o.data)===m;}).length;
    });
    return{e:e,f:f,du:du,pct:du>0?f/du*100:0};
  }).filter(function(x){return x.f>0;}).sort(function(a,b){return b.pct-a.pct||b.f-a.f;});
  var ccAbs=DB.cc.map(function(c){var r=absent(selMes,c.id);r.lb=c.cod+" - "+c.desc;r.ano=absentAno(c.id);return r;});
  var semCC=absent(selMes,"");semCC.ano=absentAno("");if(semCC.hc>0||semCC.ano.faltas>0){semCC.lb="Sem centro";ccAbs.push(semCC);}
  ccAbs=ccAbs.filter(function(r){return r.hc>0||r.ano.pct>0;}).sort(function(a,b){return b.ano.pct-a.ano.pct||b.pct-a.pct;});
  function pctF(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";}

  var movs=cMes.map(function(e){return{t:"c",d:e.adm,e:e};}).concat(dMes.map(function(e){return{t:"d",d:e.dem,e:e};}))

var relModo="mes",ORGc="#d35400";
function pct1(v){return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";}
function fmtK(v){v=v||0;return Math.abs(v)>=10000?"R$"+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":fmtBRLInt(v);}
function fimMesStr(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return m+"-"+String(d.getDate()).padStart(2,"0");}
function dUteis(m){
  var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
  for(var d=1;d<=last;d++){
    if(m+"-"+String(d).padStart(2,"0")>hj)break;
    var w=new Date(p[0],p[1]-1,d).getDay();if(w!==0&&w!==6)n++;
  }
  return n;
}
// Meses do ano com lancamentos (mesma regra do Dashboard) + mes atual
function mesesRel(ano){
  var s={};DB.oc.forEach(function(o){var m=gmk(o.data);if(m.slice(0,4)===ano)s[m]=1;});
  if(ano===String(new Date().getFullYear()))s[curMes()]=1;
  return Object.keys(s).sort();
}
function relFin(r){
  r.pctGanho=r.pot>0?r.pago/r.pot*100:0;
  r.pctPerda=r.pot>0?r.perd/r.pot*100:0;
  r.abs=r.absBase>0?r.absF/r.absBase*100:0;
  return r;
}
// Dados de um mes: premio previsto, pago, perdido (dividido por tipo), absenteismo
function relMes(m,se){
  var r={m:m,linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,ok:0,absF:0,absBase:0};
  DB.emp.forEach(function(e){
    if(se&&e.id!==se)return;
    if(!empNoMes(e,m))return;
    var pr=DB.pr.find(function(p){return p.eid===e.id;});if(!pr)return;
    var d=calcDesc(e.id,m,pr.val);
    var pf=0,pa=0,ps=0;
    DB.oc.forEach(function(x){
      if(x.eid!==e.id||gmk(x.data)!==m)return;
      var p=getPct(x.tipo,x.data);
      if(x.tipo==="falta")pf+=p;else if(x.tipo==="atraso")pa+=p;else if(x.tipo==="5s")ps+=p;
    });
    var raw=pf+pa+ps,k=raw>0?d.desc/raw:0; // desconto limitado a 100%: rateia proporcionalmente
    var l={emp:e,val:pr.val,f:d.f,a:d.a,s:d.s,pct:d.pct,desc:d.desc,rec:d.rec,lf:pf*k,la:pa*k,ls:ps*k};
    r.linhas.push(l);
    r.pot+=l.val;r.pago+=l.rec;r.perd+=l.desc;r.lf+=l.lf;r.la+=l.la;r.ls+=l.ls;r.nf+=l.f;r.na+=l.a;r.ns+=l.s;
    if(l.pct===0)r.ok++;
  });
  var fim=fimMesStr(m),ini=m+"-01",ids={};
  DB.emp.forEach(function(e){if((!se||e.id===se)&&e.adm&&e.adm<=fim&&(!e.dem||e.dem>=ini))ids[e.id]=1;});
  r.absF=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&ids[o.eid];}).length;
  r.du=dUteis(m);r.hc=Object.keys(ids).length;r.absBase=r.hc*r.du;
  return relFin(r);
}
function relAcum(lista){
  var r={linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,absF:0,absBase:0},col={};
  lista.forEach(function(x){
    ["pot","pago","perd","lf","la","ls","nf","na","ns","absF","absBase"].forEach(function(k){r[k]+=x[k];});
    x.linhas.forEach(function(l){
      var c=col[l.emp.id]||(col[l.emp.id]={emp:l.emp,val:0,desc:0,rec:0,f:0,a:0,s:0,lf:0,la:0,ls:0});
      ["val","desc","rec","f","a","s","lf","la","ls"].forEach(function(k){c[k]+=l[k];});
    });
  });
  r.linhas=Object.keys(col).map(function(k){var c=col[k];c.pct=c.val>0?c.desc/c.val*100:0;return c;});
  r.ok=r.linhas.filter(function(l){return l.desc<0.005;}).length;
  return relFin(r);
}

    +"<th style='text-align:center'>% Desc.</th><th style='text-align:right'>Premio</th><th style='text-align:right'>Desconto</th><th style='text-align:right'>A Receber</th><th style='text-align:right'>% Ganho</th></tr></thead><tbody>"
    +linhas.map(function(x){
      var cc=x.emp.ccid?DB.cc.find(function(c){return c.id===x.emp.ccid;}):null;
      var g=x.val>0?x.rec/x.val*100:0;
      return "<tr><td style='font-weight:700;color:"+B+"'>"+esc(x.emp.nome)+"</td><td style='color:#555'>"+esc(x.emp.func)+"</td>"
        +"<td>"+(cc?"<span style='background:#e3f0fa;color:"+B+";border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700'>"+esc(cc.cod)+"</span>":"—")+"</td>"
        +"<td style='color:"+RED+";font-weight:700;text-align:center'>"+x.f+"</td>"
        +"<td style='color:"+GLD+";font-weight:700;text-align:center'>"+x.a+"</td>"
        +"<td style='color:"+PUR+";font-weight:700;text-align:center'>"+x.s+"</td>"
        +"<td style='text-align:center'><span style='background:"+(x.pct>0?RED+"18":"#e8f8ee")+";color:"+(x.pct>0?RED:GRN)+";border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700'>"+pct1(x.pct)+"</span></td>"
        +"<td style='text-align:right'>"+fmtBRL(x.val)+"</td>"
        +"<td style='text-align:right;color:"+RED+";font-weight:700'>"+(x.desc>0.004?"-"+fmtBRL(x.desc):"—")+"</td>"
        +"<td style='text-align:right'><strong style='color:"+(x.desc<0.005?GRN:B)+"'>"+fmtBRL(x.rec)+"</strong></td>"
        +"<td style='text-align:right;color:"+GRN+";font-weight:700'>"+pct1(g)+"</td></tr>";
    }).join("")
    +"</tbody><tfoot><tr style='background:"+B+"18;font-weight:700'>"
    +"<td colspan='3' style='color:"+B+";font-size:11px;padding:.5rem .75rem'>TOTAIS</td>"
    +"<td style='text-align:center;color:"+RED+"'>"+P.nf+"</td><td style='text-align:center;color:"+GLD+"'>"+P.na+"</td><td style='text-align:center;color:"+PUR+"'>"+P.ns+"</td>"
    +"<td style='text-align:center'>"+pct1(P.pctPerda)+"</td>"
    +"<td style='text-align:right;color:"+B+"'>"+fmtBRL(P.pot)+"</td>"
    +"<td style='text-align:right;color:"+RED+"'>-"+fmtBRL(P.perd)+"</td>"
    +"<td style='text-align:right;color:"+GRN+";font-weight:800'>"+fmtBRL(P.pago)+"</td>"
    +"<td style='text-align:right;color:"+GRN+";font-weight:800'>"+pct1(P.pctGanho)+"</td></tr></tfoot></table></div>";

  var cfgComp=relCfgComp(P,1),cfgCol=relCfgColab(P,1,12);
  var nCol=cfgCol?cfgCol.data.labels.length:0;

  document.getElementById("p-relatorio").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Análise do Pagamento do Prêmio Cartão</h1>"
    +"<div class='sub'>Ganhos, perdas e absenteismo &middot; "+esc(per)+(empSel?" &middot; "+esc(empSel.nome):"")+"</div></div>"
    +"<button class='btnp btn-ic' onclick='gerarAnalisePDF()'><i class='ti ti-file-download'></i>Gerar relatorio PDF</button></div>"
    +"<div style='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1.1rem'>"
    +"<div class='seg'>"+segB("mes","Mensal")+segB("ano","Anual (Acumulado)")+"</div>"
    +box("ti-calendar","Ano:",true)+"<select id='rel-ano' onchange='rRel()' style='"+selSt+"'>"+anoOpts+"</select></div>"
    +box("ti-calendar-event","Mes:",relModo==="mes")+"<select id='rel-mes' onchange='rRel()' style='"+selSt+"'>"
    +MOS.map(function(m,i){var v=selAno+"-"+String(i+1).padStart(2,"0");return "<option value='"+v+"'"+(v===selMes?" selected":"")+">"+m+"</option>";}).join("")+"</select></div>"
    +"<select id='re' onchange='rRel()' style='width:260px;max-width:100%;padding:.45rem .7rem;font-size:13px'>"+eOpts+"</select>"
    +"</div>"

    +"<div class='ga' style='margin-bottom:1.1rem'>"
    +sCard("Premio previsto",fmtBRL(P.pot),B,"ti-gift",per)
    +sCard("Total pago",fmtBRL(P.pago),GRN,"ti-credit-card",P.linhas.length+" colaborador"+(P.linhas.length!==1?"es":""))
    +sCard("Total perdido",fmtBRL(P.perd),RED,"ti-trending-down",pct1(P.pctPerda)+" do previsto")
    +sCard("% de ganho",pct1(P.pctGanho),GRN,"ti-percentage",P.ok+" com 100% do premio")
    +sCard("Perda com faltas",fmtBRL(P.lf),RED,"ti-calendar-x",P.nf+" falta"+(P.nf!==1?"s":""))
    +sCard("Absenteismo",pct1(P.abs),ORGc,"ti-user-off",P.absF+" faltas no periodo")
    +"</div>"

    +card("Ganho x Perda mes a mes - "+selAno+" <span style='color:#999;font-weight:500'>(barras em R$ e linha com % de ganho)</span>",GRN,"ti-chart-bar",
      anoD.length?"<div style='height:300px;position:relative'><canvas id='ch-relgp'></canvas></div>":vazio("Sem dados em "+selAno))
    +"<div style='height:1rem'></div>"
    +card("Perdas com faltas e absenteismo mes a mes - "+selAno+" <span style='color:#999;font-weight:500'>(perdas em R$ e linha com absenteismo)</span>",RED,"ti-report-money",
      anoD.length?"<div style='height:300px;position:relative'><canvas id='ch-relpd'></canvas></div>"
        +"<div class='hint' style='margin-top:6px'>Absenteismo = faltas &divide; (colaboradores no mes &times; dias uteis seg-sex) &times; 100. Quando o desconto passa de 100%, a perda e rateada entre os tipos.</div>"
        :vazio("Sem dados em "+selAno))
    +"<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem;margin:1rem 0'>"
    +card("Composicao das perdas - "+esc(per),RED,"ti-chart-donut",cfgComp?"<div style='height:280px;position:relative'><canvas id='ch-relcomp'></canvas></div>":vazio("Sem perdas no periodo"))
    +card("Maiores perdas por colaborador - "+esc(per),RED,"ti-users",cfgCol?"<div style='height:"+Math.max(280,nCol*30+40)+"px;position:relative'><canvas id='ch-relcol'></canvas></div>":vazio("Sem perdas no periodo"))
    +"</div>"
    +card("Resumo mes a mes - "+selAno,B,"ti-table",resumo)
    +"<div style='height:1rem'></div>"
    +card("Pagamento Cartao Beneficio - "+esc(per),B,"ti-credit-card",tabColab);

  if(anoD.length){
    CH.relgp=new Chart(document.getElementById("ch-relgp"),relCfgGP(labels,anoD,1,selIdx));
    CH.relpd=new Chart(document.getElementById("ch-relpd"),relCfgPerdas(labels,anoD,1,selIdx));
  }
  if(cfgComp)CH.relcomp=new Chart(document.getElementById("ch-relcomp"),cfgComp);
  if(cfgCol)CH.relcol=new Chart(document.getElementById("ch-relcol"),cfgCol);
}


// ═══ PDF: ANALISE DO PAGAMENTO DO PREMIO CARTAO ELEVE ═══
function gerarAnalisePDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._relStats;if(!st){alert("Abra a tela de Relatorios antes de gerar o PDF.");return;}
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var W=297,H=210,mg=12,cw=W-mg*2,BANDH=27,PX=7;
  var C={ink:[30,32,36],b:[11,78,131],bl:[18,125,203],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],line:[226,231,238],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  var titulo="Análise do Pagamento do Prêmio Cartão Eleve";
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  var periodo=(st.modo==="mes"?"Período: ":"Período: ")+st.per+(st.empNome?"  |  Colaborador: "+st.empNome:"  |  Todos os colaboradores");

  function header(){
    fill(C.ink);doc.rect(0,0,W,BANDH,"F");
    fill(C.bl);doc.rect(0,BANDH,W,1.3,"F");
    if(window._logoPNG){doc.addImage(window._logoPNG,"PNG",mg,6.5,64.4,14);}
    else{font(18,true);txt([255,255,255]);doc.text("ELEVE",mg,16);}
    font(15,true);txt([255,255,255]);doc.text(titulo,W-mg,11.5,{align:"right"});
    font(8.5);txt([205,212,222]);doc.text(periodo,W-mg,17.5,{align:"right"});
    font(7);txt([165,175,190]);doc.text("Gerado em "+gerado,W-mg,22,{align:"right"});
    return BANDH+8;
  }
  function section(t,y,c){fill(c||C.b);doc.rect(mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,mg+4.5,y);}
  function panel(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");}
  function kpi(x,y,w,h,lb,val,sub,c){
    panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.8,true);txt(C.mut);doc.text(lb.toUpperCase(),x+3,y+6.5);
    font(12.5,true);txt(c);doc.text(val,x+3,y+13.5);
    if(sub){font(6.8);txt(C.mut);doc.text(sub,x+3,y+18);}
  }
  function chartImg(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*PX);cv.height=Math.round(hmm*PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();
    return img;
  }
  function chartPanel(cfg,x,y,w,h,t,c,nota){
    panel(x,y,w,h);
    font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;
    var img=chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  }
  // Tabela com quebra de pagina
  function table(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=mg,tw=cols.reduce(function(a,c){return a+c.w;},0);
    function head(){
      fill(C.b);doc.rect(x,y,tw,rh+.6,"F");font(7.3,true);txt([255,255,255]);
      var cx=x;cols.forEach(function(c){doc.text(c.h,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.6,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});cx+=c.w;});
      y+=rh+.6;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>H-14){doc.addPage();y=header();if(opt.titulo)section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill([226,236,246]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._hl){fill([227,240,250]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        var mw=c.w-3;
        font(7.2,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>mw)v=v.slice(0,-2);
        var cor=c.cor?c.cor(r):C.txt;txt(r._total&&!c.cor?C.b:cor);
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  }

  var P=st.P,A=st.acum;
  // ===== PAGINA 1 =====
  var y=header();
  section("Indicadores - "+st.per,y);y+=3.5;
  var ks=[
    ["Prêmio previsto",fmtBRL(P.pot),st.per,C.b],
    ["Total pago",fmtBRL(P.pago),P.linhas.length+" colaboradores",C.grn],
    ["Total perdido",fmtBRL(P.perd),pct1(P.pctPerda)+" do previsto",C.red],
    ["% de ganho",pct1(P.pctGanho),P.ok+" com 100% do prêmio",C.grn],
    ["Perda com faltas",fmtBRL(P.lf),P.nf+" faltas",C.red],
    ["Absenteísmo",pct1(P.abs),P.absF+" faltas no período",C.org]
  ];
  var gap=3.2,kw=(cw-gap*5)/6,kh=21;
  ks.forEach(function(k,i){kpi(mg+i*(kw+gap),y,kw,kh,k[0],k[1],k[2],k[3]);});
  y+=kh+8;
  section("Evolução mês a mês - "+st.selAno,y);y+=3.5;
  var chH=(H-12-y-4)/2;
  chartPanel(st.anoD.length?relCfgGP(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Ganho x Perda mês a mês (R$) e % de ganho",C.grn,"Acumulado: pago "+fmtBRL(A.pago)+"  |  perdido "+fmtBRL(A.perd)+"  |  ganho "+pct1(A.pctGanho));
  y+=chH+3;
  chartPanel(st.anoD.length?relCfgPerdas(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Perdas com faltas, atrasos e 5S (R$) e absenteísmo",C.red,"Acumulado: perda com faltas "+fmtBRL(A.lf)+"  |  absenteísmo "+pct1(A.abs));

  // ===== PAGINA 2 =====
  doc.addPage();y=header();
  section("Composição das perdas e colaboradores - "+st.per,y,C.red);y+=3.5;
  var pH=66,lw=cw*0.36;
  chartPanel(relCfgComp(P,1.6),mg,y,lw,pH,"Composição das perdas",C.red);
  chartPanel(relCfgColab(P,1.35,10),mg+lw+gap,y,cw-lw-gap,pH,"Maiores perdas por colaborador",C.red,"R$ perdido  ·  % do prêmio");
  y+=pH+8;
  section("Resumo mês a mês - "+st.selAno,y);y+=3;
  var gC=function(){return C.grn;},rC=function(){return C.red;},oC=function(){return C.org;};
  var colsR=[
    {h:"Mês",k:"mes",w:30,b:true,cor:function(){return C.b;}},{h:"Previsto",k:"pot",w:26,al:"r"},{h:"Pago",k:"pago",w:26,al:"r",cor:gC},
    {h:"Perdido",k:"perd",w:26,al:"r",cor:rC},{h:"% Ganho",k:"pg",w:19,al:"r",cor:gC},{h:"% Perda",k:"pp",w:19,al:"r",cor:rC},
    {h:"Perda faltas",k:"lf",w:25,al:"r",cor:rC},{h:"Perda atrasos",k:"la",w:25,al:"r"},{h:"Perda 5S",k:"ls",w:21,al:"r"},
    {h:"Faltas",k:"nf",w:13,al:"c"},{h:"Atrasos",k:"na",w:14,al:"c"}
  ];
  colsR.push({h:"Absenteísmo",k:"abs",w:cw-colsR.reduce(function(a,c){return a+c.w;},0),al:"r",cor:oC});
  function rowR(d,lb){return{mes:lb,pot:fmtBRL(d.pot),pago:fmtBRL(d.pago),perd:fmtBRL(d.perd),pg:pct1(d.pctGanho),pp:pct1(d.pctPerda),lf:fmtBRL(d.lf),la:fmtBRL(d.la),ls:fmtBRL(d.ls),nf:d.nf,na:d.na,abs:pct1(d.abs)};}
  var rowsR=st.anoD.map(function(d,i){var r=rowR(d,fmtM(d.m));r._hl=i===st.selIdx;return r;});
  var tr=rowR(A,"Acumulado "+st.selAno);tr._total=true;rowsR.push(tr);
  table(y,colsR,rowsR,{rh:5.3,titulo:"Resumo mês a mês - "+st.selAno});

  // ===== PAGINA 3+ : colaboradores =====
  doc.addPage();y=header();
  section("Pagamento Cartão Benefício por colaborador - "+st.per,y);y+=3;
  var colsC=[
    {h:"Colaborador",k:"nome",w:62,b:true,cor:function(){return C.b;}},{h:"Função",k:"func",w:40},{h:"C.Custo",k:"cc",w:17,al:"c"},
    {h:"Faltas",k:"f",w:13,al:"c",cor:rC},{h:"Atrasos",k:"a",w:14,al:"c",cor:function(){return [184,130,10];}},{h:"5S",k:"s",w:10,al:"c",cor:function(){return C.pur;}},
    {h:"% Desc.",k:"pct",w:17,al:"r",cor:rC},{h:"Prêmio",k:"val",w:26,al:"r"},{h:"Desconto",k:"desc",w:26,al:"r",cor:rC},
    {h:"A Receber",k:"rec",w:26,al:"r",b:true,cor:gC},{h:"% Ganho",k:"g",w:cw-62-40-17-13-14-10-17-26*3,al:"r",cor:gC}
  ];
  var rowsC=P.linhas.slice().sort(function(a,b){return a.emp.nome.localeCompare(b.emp.nome);}).map(function(x){
    var cc=x.emp.ccid?DB.cc.find(function(c){return c.id===x.emp.ccid;}):null;
    return{nome:x.emp.nome,func:x.emp.func,cc:cc?cc.cod:"-",f:x.f,a:x.a,s:x.s,pct:pct1(x.pct),val:fmtBRL(x.val),desc:x.desc>0.004?"-"+fmtBRL(x.desc):"-",rec:fmtBRL(x.rec),g:pct1(x.val>0?x.rec/x.val*100:0)};
  });
  rowsC.push({_total:true,nome:"TOTAIS ("+P.linhas.length+")",func:"",cc:"",f:P.nf,a:P.na,s:P.ns,pct:pct1(P.pctPerda),val:fmtBRL(P.pot),desc:"-"+fmtBRL(P.perd),rec:fmtBRL(P.pago),g:pct1(P.pctGanho)});
  if(P.linhas.length===0){font(9);txt([170,170,170]);doc.text("Nenhum colaborador com prêmio no período.",mg,y+8);}
  else table(y,colsC,rowsC,{rh:5.8,titulo:"Pagamento Cartão Benefício por colaborador - "+st.per});

  // Rodapes com numeracao
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){
    doc.setPage(p);
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.3);doc.line(mg,H-9,W-mg,H-9);
    font(7.2);txt([160,160,160]);
    doc.text("Eleve Telhas e Perfis Metálicos - Gestão de Prêmios",mg,H-5);
    doc.text(titulo,W/2,H-5,{align:"center"});
    doc.text("Página "+p+"/"+n,W-mg,H-5,{align:"right"});
  }
  doc.save("analise-premio-cartao-"+(st.modo==="mes"?st.selMes:st.selAno)+(st.empNome?"-colaborador":"")+".pdf");
}
